<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: "Alibaba PuHuiTi Regular";
      src: url("qrc:///fonts/AlibabaPuHuiTi-3-55-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Alibaba PuHuiTi Medium";
      src: url("qrc:///fonts/AlibabaPuHuiTi-3-65-Medium.ttf") format("truetype");
      font-style: normal;
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Alibaba PuHuiTi Bold";
      src: url("qrc:///fonts/AlibabaPuHuiTi-3-85-Bold.ttf") format("truetype");
      font-style: normal;
      font-weight: bold;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      box-sizing: border-box;
      color: rgba(0, 0, 0, .86);
      font-family: "Alibaba PuHuiTi Regular", "Microsoft YaHei", Arial, "Noto Sans CJK SC", "Noto Color Emoji", sans-serif;
      font-size: 16px;
      line-height: 1.62;
      letter-spacing: 0;
      word-spacing: 0;
      font-variant-numeric: normal;
      text-align: left;
      text-rendering: auto;
    }

    #app {
      box-sizing: border-box;
      width: calc(100% - 8px);
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 0 16px 8px 44px;
    }

    .turn-nav {
      position: absolute;
      z-index: 20;
      left: 10px;
      top: 50%;
      display: flex;
      max-height: 60%;
      flex-direction: column;
      gap: 0;
      overflow: visible;
      transform: translateY(-50%);
    }
    .turn-nav[hidden] { display: none; }
    .turn-nav-item {
      position: relative;
      display: flex;
      width: 24px;
      height: 6px;
      padding: 0;
      align-items: center;
      border: 0;
      background: transparent;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 4px;
    }
    .turn-nav-item:last-child {
      margin-bottom: 0;
    }
    .turn-nav-item:focus,
    .turn-nav-item:focus-visible {
      outline: none;
      box-shadow: none;
    }
    .turn-nav-mark {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 111px;
      background: #EBEDF0;
      transition: width 140ms ease, background-color 140ms ease;
    }
    .turn-nav-item:hover .turn-nav-mark {
      width: 6px;
      background: #C9CDD5;
    }
    .turn-nav-item.active .turn-nav-mark {
      width: 12px;
      background: #E6E7EB;
    }
    .turn-nav-tooltip {
      position: fixed;
      z-index: 1000;
      display: block;
      width: max-content;
      max-width: 280px;
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.65) !important;
      color: #FFFFFF !important;
      font-size: 14px !important;
      line-height: 19px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 120ms ease, transform 120ms ease;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .18);
    }
    .turn-nav-tooltip.visible {
      opacity: 1;
      visibility: visible;
    }

    .scroll-to-bottom {
      position: fixed;
      z-index: 30;
      left: 50%;
      /* ChatWebView ends 8px above the composer, so 14px here gives a 22px gap. */
      bottom: 14px;
      display: flex;
      box-sizing: border-box;
      width: 34px;
      height: 34px;
      padding: 0;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 50%;
      background: #FFFFFF;
      color: rgba(0, 0, 0, .62);
      cursor: pointer;
      outline: none;
      box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.06), 0 4px 12px 0 rgba(0, 0, 0, 0.16);
      transform: translateX(-50%);
      transition: background-color 120ms ease, color 120ms ease,
                  box-shadow 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .scroll-to-bottom[hidden] { display: none; }
    .scroll-to-bottom:hover {
      background: #F7F9FA;
      color: rgba(0, 0, 0, .86);
      box-shadow: 0 3px 10px rgba(0, 0, 0, .24);
    }
    .scroll-to-bottom:active {
      background: #EBEDF0;
      box-shadow: 0 1px 5px rgba(0, 0, 0, .20);
    }
    .scroll-to-bottom:focus-visible {
      box-shadow: 0 0 0 2px rgba(0, 107, 255, .22),
                  0 2px 8px rgba(0, 0, 0, .20);
    }
    .scroll-to-bottom img {
      display: block;
      width: 20px;
      height: 20px;
      object-fit: contain;
      pointer-events: none;
    }

    #app::-webkit-scrollbar,
    pre::-webkit-scrollbar,
    .table-wrap::-webkit-scrollbar,
    .tool-detail-text::-webkit-scrollbar,
    .orphan-tool::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    #app::-webkit-scrollbar-track,
    pre::-webkit-scrollbar-track,
    .table-wrap::-webkit-scrollbar-track,
    .tool-detail-text::-webkit-scrollbar-track,
    .orphan-tool::-webkit-scrollbar-track {
      background: transparent;
    }

    #app::-webkit-scrollbar-thumb,
    pre::-webkit-scrollbar-thumb,
    .table-wrap::-webkit-scrollbar-thumb,
    .tool-detail-text::-webkit-scrollbar-thumb,
    .orphan-tool::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: transparent;
    }

    #app:hover::-webkit-scrollbar-thumb,
    #app.scrolling::-webkit-scrollbar-thumb,
    pre:hover::-webkit-scrollbar-thumb,
    pre.scrolling::-webkit-scrollbar-thumb,
    .table-wrap:hover::-webkit-scrollbar-thumb,
    .table-wrap.scrolling::-webkit-scrollbar-thumb,
    .tool-detail-text:hover::-webkit-scrollbar-thumb,
    .tool-detail-text.scrolling::-webkit-scrollbar-thumb,
    .orphan-tool:hover::-webkit-scrollbar-thumb,
    .orphan-tool.scrolling::-webkit-scrollbar-thumb {
      background: rgba(15, 23, 42, .24);
    }

    #app:hover::-webkit-scrollbar-thumb:hover,
    #app.scrolling::-webkit-scrollbar-thumb:hover,
    pre:hover::-webkit-scrollbar-thumb:hover,
    .table-wrap:hover::-webkit-scrollbar-thumb:hover,
    .tool-detail-text:hover::-webkit-scrollbar-thumb:hover,
    .orphan-tool:hover::-webkit-scrollbar-thumb:hover {
      background: rgba(15, 23, 42, .38);
    }

    .message {
      box-sizing: border-box;
      width: 100%;
      max-width: 840px;
      margin: 0 auto 12px;
    }

    .message.user {
      display: flex;
      justify-content: flex-end;
    }

    .bubble {
      box-sizing: border-box;
      min-height: 24px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .bubble.user {
      width: fit-content;
      max-width: 75%;
      min-width: 48px;
      padding: 12px 16px;
      background: #EBEDF0;
      color: rgba(0, 0, 0, .9);
    }

    .user-file-ref,
    .user-file-ref:hover {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 260px;
      margin: 1px 3px;
      padding: 3px 8px;
      border: 1px solid rgba(84, 73, 180, .18);
      border-radius: 6px;
      background: rgba(116, 103, 214, .14);
      color: rgba(0, 0, 0, .82);
      text-decoration: none;
      vertical-align: middle;
      white-space: nowrap;
    }

    .user-file-icon {
      position: relative;
      width: 12px;
      height: 14px;
      flex: 0 0 12px;
      border: 1px solid rgba(84, 73, 180, .55);
      border-radius: 2px;
      box-sizing: border-box;
    }

    .user-file-icon:before,
    .user-file-icon:after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      height: 1px;
      background: rgba(84, 73, 180, .55);
    }

    .user-file-icon:before { top: 4px; }
    .user-file-icon:after { top: 8px; }

    .user-file-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bubble.assistant {
      width: 100%;
      padding: 12px 16px;
      color: rgba(0, 0, 0, .85);
      background: transparent;
    }

    .bubble.intermediate {
      color: rgba(0, 0, 0, .55);
      font-style: italic;
    }

    .bubble.aside {
      padding: 2px 4px;
      color: rgba(0, 0, 0, .56);
      font-size: 15px;
      font-style: italic;
    }
    .thought-aside {
      margin-bottom: 8px;
    }
    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body > :last-child { margin-bottom: 0; }
    p { margin: 0 0 10px; }
    h1, h2, h3, h4, h5, h6 {
      margin: 18px 0 8px;
      line-height: 1.32;
      font-weight: 700;
      color: rgba(0, 0, 0, .9);
    }
    h1 { font-size: 1.42em; }
    h2 { font-size: 1.28em; }
    h3 { font-size: 1.16em; }
    h4, h5, h6 { font-size: 1.04em; }
    ul, ol { margin: 0 0 10px 1.35em; padding: 0; }
    li { margin: 3px 0; }
    blockquote {
      margin: 10px 0;
      padding: 8px 12px;
      border-left: 3px solid #94a3b8;
      background: #f8fafc;
      color: rgba(0, 0, 0, .58);
    }
    pre {
      margin: 10px 0;
      padding: 12px;
      overflow-x: auto;
      border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 8px;
      background: #f6f8fa;
      line-height: 1.48;
      white-space: pre;
    }
    code {
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      font-size: .92em;
    }
    :not(pre) > code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #f6f8fa;
    }
    .num-run {
      display: inline-block;
      white-space: nowrap;
      font-family: Arial, "Helvetica Neue", "Noto Sans", sans-serif;
      letter-spacing: 0;
      word-spacing: 0;
      font-kerning: normal;
      font-variant-numeric: normal;
      font-feature-settings: "kern" 1;
      text-align: left;
    }
    .table-wrap {
      width: 100%;
      margin: 10px 0;
      display: block;
      overflow-x: auto;
    }
    table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }
    th, td {
      padding: 7px 9px;
      border: 1px solid rgba(15, 23, 42, .12);
      text-align: left;
      vertical-align: top;
      word-break: normal;
      overflow-wrap: break-word;
    }
    th,
    .nowrap-cell {
      white-space: nowrap;
      overflow-wrap: normal;
    }
    th:last-child, td:last-child {
      min-width: 18em;
      white-space: normal;
    }
    th { background: #f1f5f9; font-weight: 650; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a.local-file-link,
    a.local-file-link:hover {
      text-decoration: none;
    }
    a.local-file-link code {
      color: inherit;
      background: #f6f8fa;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    a.local-file-link:hover code {
      background:
        linear-gradient(currentColor, currentColor) left calc(100% - 2px) / 100% 1px repeat-x,
        #f6f8fa;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    a.local-file-link .num-run {
      display: inline;
      color: inherit;
    }
    hr { height: 1px; border: 0; margin: 16px 0; background: rgba(15, 23, 42, .12); }

    .artifact-section {
      box-sizing: border-box;
      width: 100%;
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid #E6E7EB;
      font-family: "Alibaba PuHuiTi Regular", "Microsoft YaHei", sans-serif;
      font-weight: 400;
      letter-spacing: 0;
    }
    .artifact-header {
      display: flex;
      min-height: 32px;
      margin-bottom: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .artifact-heading {
      min-width: 0;
      font-family: "Alibaba PuHuiTi Bold", "Microsoft YaHei", sans-serif;
      font-size: 20px;
      font-weight: bold;
      line-height: 28px;
      white-space: nowrap;
    }
    .artifact-title { color: #000000; }
    .artifact-count {
      margin-left: 4px;
      color: rgba(0, 0, 0, 0.45);
    }
    .message.artifact-turn { margin-top: -4px; }
    .artifact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .artifact-card,
    .artifact-card:hover {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 0;
      height: 36px;
      padding: 6px 8px;
      border-radius: 8px;
      background: #F7F9FA;
      color: #000000;
      text-decoration: none;
    }
    .artifact-card:hover { background: #EBEDF0; }
    .artifact-icon {
      display: block;
      flex: 0 0 20px;
      width: 20px;
      height: 20px;
      margin-right: 4px;
      object-fit: contain;
    }
    .artifact-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      line-height: 24px;
      color: #000000;
    }
    .artifact-more {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      height: 32px;
      margin: 0;
      padding: 4px 0 4px 12px;
      border: 0;
      background: transparent;
      color: #006BFF;
      font-family: inherit;
      font-weight: 400;
      font-size: 16px;
      line-height: 24px;
      letter-spacing: 0;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .artifact-more:focus,
    .artifact-more:focus-visible {
      outline: none;
      box-shadow: none;
    }
    .artifact-more:hover {
      background: transparent;
      color: #006BFF;
      text-decoration: none;
    }
    .artifact-more-arrow {
      position: relative;
      display: inline-block;
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      margin-left: 4px;
    }
    .artifact-more-arrow:before {
      content: "";
      position: absolute;
      left: 5px;
      top: 5px;
      width: 5px;
      height: 5px;
      border-right: 1.2px solid currentColor;
      border-bottom: 1.2px solid currentColor;
      transform: rotate(-45deg);
    }
    @media (max-width: 720px) {
      .artifact-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 460px) {
      .artifact-grid { grid-template-columns: minmax(0, 1fr); }
    }

    .compaction {
      position: relative;
      height: 20px;
    }
    .compaction:before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      height: 1px;
      background: rgba(0, 0, 0, .08);
    }

    .tool {
      box-sizing: border-box;
      width: 100%;
      max-width: 840px;
      margin: 0 auto 12px;
      color: rgba(0, 0, 0, .86);
    }

    .thought-group {
      margin-bottom: 12px;
    }
    .thought-header {
      display: flex;
      align-items: center;
      min-height: 28px;
      width: 100%;
      padding: 2px 0;
      border: 0;
      background: transparent;
      color: rgba(0, 0, 0, .78);
      font: inherit;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .thought-header:focus,
    .thought-header:focus-visible {
      outline: none;
      box-shadow: none;
    }
    .thought-title {
      line-height: 24px;
    }
    .thought-status {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .thought-arrow {
      margin-left: 5px;
      color: rgba(0, 0, 0, .42);
      font-size: 13px;
      line-height: 1;
      transition: transform 140ms ease;
    }
    .thought-header[aria-expanded="true"] .thought-arrow {
      transform: rotate(90deg);
    }
    .thought-body {
      margin: 1px 0 1px 2px;
      padding-left: 20px;
      border-left: 2px solid #EBEDF0;
    }
    .thought-body[hidden] {
      display: none;
    }
    .thought-text {
      margin: 0 0 4px;
      color: rgba(0, 0, 0, .58);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.62;
    }
    .thought-text.intermediate {
      color: rgba(0, 0, 0, .58);
      font-style: normal;
    }
    .thought-body .tool {
      width: 100%;
      max-width: none;
      margin: 0;
    }
    .thought-body .tool-header {
      min-height: 26px;
    }
    .thought-body .tool-detail-text {
      margin-bottom: 5px;
    }

    /* ask_user 提问卡已迁到 QML（components/AskUserCard.qml）：
       聊天正文是 WebEngineView，底边停在输入框上方，卡片放在页面里
       永远盖不住 QML 的输入框，必然出现"两个框同时存在"。
       这里只保留"已回答/已跳过"的结果行样式。 */
    .question-result {
      margin-top: 4px;
      font-size: 13px;
      color: #374151;
    }
    .question-result.ok { color: #15803D; }
    .question-result.warn { color: #B45309; }
    .question-result.err { color: #B91C1C; }
    .tool-header {
      display: flex;
      align-items: center;
      gap: 0;
      min-height: 24px;
      user-select: none;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tool-header:focus,
    .tool-header:focus-visible {
      outline: none;
      box-shadow: none;
    }
    .tool-name {
      font-family: "Alibaba PuHuiTi Bold", "Microsoft YaHei", Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      color: #000000;
    }
    .tool-meta {
      margin-left: 8px;
      font-family: "Alibaba PuHuiTi Regular", "Microsoft YaHei", Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: rgba(0, 0, 0, .45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .tool-arrow {
      margin-left: 2px;
      color: rgba(0, 0, 0, .55);
      font-size: 13px;
      line-height: 1;
    }
    .status-slot {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .status-icon {
      display: block;
      width: 16px;
      height: 16px;
      object-fit: contain;
    }
    .spinner {
      box-sizing: border-box;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid rgba(0, 107, 255, .22);
      border-top-color: #006BFF;
      animation: spin .75s linear infinite;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.error { background: #EF4444; animation: none; }
    .dot.cancelled { background: #9CA3AF; animation: none; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .tool-detail-text,
    .orphan-tool {
      font-family: "Alibaba PuHuiTi Regular", "Microsoft YaHei", Arial, sans-serif;
      box-sizing: border-box;
      color: #000000;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
      font-size: 16px;
      font-weight: 400;
    }
    .tool-detail-text {
      max-height: 160px;
      margin: 0 0 0 24px;
      overflow: auto;
      line-height: 22px;
    }
    .tool-detail-text.error,
    .orphan-tool.error {
      color: #FF3D40;
    }
    .orphan-tool-title {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 6px;
      color: #000000;
      font-family: "Alibaba PuHuiTi Bold", "Microsoft YaHei", Arial, sans-serif;
      font-weight: bold;
      font-size: 16px;
    }
    .task-complete {
      display: flex;
      align-items: center;
      gap: 0;
      min-height: 24px;
      margin-top: 8px;
      color: #000000;
      font-family: "Alibaba PuHuiTi Bold", "Microsoft YaHei", Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
    }
    .task-ended-icon {
      width: 10px;
      height: 10px;
      border-radius: 5px;
      background: #737373;
    }

    /* ===== 深色主题（由宿主通过 window.MedClawChat.setTheme('dark') 切换） ===== */
    html[data-theme="dark"] body { color: rgba(255, 255, 255, .86); }
    html[data-theme="dark"] .turn-nav-mark { background: #262B30; }
    html[data-theme="dark"] .turn-nav-item:hover .turn-nav-mark { background: #3A434C; }
    html[data-theme="dark"] .turn-nav-item.active .turn-nav-mark { background: #3A434C; }
    html[data-theme="dark"] .scroll-to-bottom {
      border-color: rgba(255, 255, 255, .08);
      background: #242627;
      color: rgba(255, 255, 255, .62);
      box-shadow: 0 2px 4px 0 rgba(0, 0, 0, .4), 0 4px 12px 0 rgba(0, 0, 0, .4);
    }
    html[data-theme="dark"] .scroll-to-bottom:hover { background: #33363A; color: rgba(255, 255, 255, .86); }

      function toolTitle(name) {

      function humanizeFallback(name) {

      // 把工具返回的机器味文案翻译成人话。只作用于客户端展示，

      function cleanToolText(raw) {
        var t = String(raw || '');
        // 机器可读的交付物标记：客户端另有产物面板，正文不展示 JSON
        t = t.replace(/<medclaw-deliverables>[\s\S]*?<\/medclaw-deliverables>/g, '');
        // 去掉行首状态 emoji（状态图标已表达）
        t = t.replace(/^[✅❌⚠️]\s*/u, '');
        t = t.replace(/\n[✅❌⚠️]\s*/gu, '\n');
        // 绝对路径折叠：只留末段目录名
        t = t.replace(/📁\s*输出目录[：:]\s*([A-Za-z]:[\\/][^\r\n]*)/g, function (m, p) {
          var seg = String(p).replace(/[\\/]+$/, '').split(/[\\/]/).pop();
          return '输出目录：' + (seg || p);
        });
        // 交付物长列表截断：前 5 个 + 总数
        t = t.replace(/📦\s*交付物[（(](\d+)[）)][：:]\s*([^\r\n]*)/g, function (m, n, list) {
          var items = String(list).split(/[、,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
          var shown = items.slice(0, 5).join('、');
          var tail = items.length > 5 ? '、…' : '';
          return '交付物：' + n + ' 个' + (shown ? '（' + shown + tail + '）' : '');
        });
        // 内核 write / edit 文案：英文 + 绝对路径 → 中文 + 文件名
        t = t.replace(/Successfully wrote (\d+) bytes to ([^\r\n]+)/g, function (m, n, p) {
          return "已写入 " + argBasename(p.trim()) + "（" + n + " 字节）";

          return "已修改 " + argBasename(p.trim());
        });
        // 英文/机器文案 → 中文
        for (var i = 0; i < TOOL_TEXT_REWRITES.length; i++) {

      // 运行中展示的是工具参数（JSON）。参数也要说人话，不要甩原始 JSON。

      function argBasename(value) {
        var s = String(value == null ? "" : value).replace(/[\\/]+$/, "");
        var parts = s.split(/[\\/]/);
        return parts[parts.length - 1] || s;
      }

      function humanizeArgValue(value) {
        if (value === null || value === undefined) return "";
        if (Array.isArray(value)) {
          return value.map(humanizeArgValue).filter(function (s) { return s; }).join("、");
        }
        if (typeof value === "object") return JSON.stringify(value);
        var s = String(value);
        if (value === true) return "是";
        if (value === false) return "否";
        // 绝对路径只留末段
        if (/^[A-Za-z]:[\\/]/.test(s) || /^[\\/]/.test(s)) return argBasename(s);
        return s;
      }

      function humanizeToolArgs(toolName, argsText) {
        var raw = String(argsText || "");
        if (!raw) return "准备中…";
        var obj;
        try { obj = JSON.parse(raw); } catch (e) {
          return raw.length > 300 ? raw.slice(0, 300) + "…" : raw;
        }
        if (!obj || typeof obj !== "object" || Array.isArray(obj)) {
          return raw.length > 300 ? raw.slice(0, 300) + "…" : raw;
        }
        var parts = [];
        var seen = {};
        function push(key) {
          if (seen[key] || !(key in obj)) return;
          var value = humanizeArgValue(obj[key]);
          if (!value) return;
          seen[key] = true;
          parts.push((ARG_LABELS[key] || key) + "：" + value);
        }
        ["input", "inputs", "file", "files", "path", "output", "output_dir",
         "tool", "tool_name", "region", "modality", "target"].forEach(push);
        // 其余标量字段（跳过已用、空值、false、嵌套对象）
        Object.keys(obj).forEach(function (key) {
          if (seen[key]) return;
          var value = obj[key];
          if (value === false || value === null || value === undefined || value === "") return;
          if (typeof value === "object" && !Array.isArray(value)) return;
          push(key);
        });
        if (!parts.length) return raw.length > 300 ? raw.slice(0, 300) + "…" : raw;
        return parts.join("\n");
      }



      function normalizeNumericSpacing(value) {
        var text = String(value || '').replace(/[\u00a0\u2007\u202f]/g, ' ');
        for (var i = 0; i < 3; i++) {
          text = text
            .replace(/(\d)\s+(?=\d)/g, '$1')
            .replace(/([\u4e00-\u9fff])\s+(?=\d)/g, '$1')
            .replace(/(\d)\s+([\u4e00-\u9fff])/g, '$1$2')
            .replace(/(\d)\s+(?=[\d.,，．%％+＋])/g, '$1')
            .replace(/([.,，．])\s+(?=\d)/g, '$1')
            .replace(/(\d)\s+([%％+＋])/g, '$1$2')
            .replace(/([+＋])\s+([\u4e00-\u9fff])/g, '$1$2')
            .replace(/(\d)\s*([-–~～])\s*(?=\d)/g, '$1$2')
            .replace(/([第约近超逾])\s+(?=\d)/g, '$1');
        }
        return text;
      }

      function protectNumericRuns(html) {
        return String(html || '').replace(/(<[^>]+>|&[a-zA-Z#0-9]+;|[^<&]+)/g, function (part) {
          if (part.charAt(0) === '<' || part.charAt(0) === '&') return part;
          return part.replace(/[+-]?\d[\d.,，．:：/\\-–~～%％+＋]*/g, function (run) {
            return '<span class="num-run">' + run + '</span>';
          });
        });
      }

      function localLinkHref(ref) {
        return 'medclaw-local:' + encodeURIComponent(ref);
      }

      function decodeHtmlText(value) {
        return String(value || '')
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&amp;/g, '&');
      }

      function isLikelyLocalRef(ref) {
        var value = String(ref || '').trim();
        return /^(?:file:\/\/|~\/|\/)/.test(value)
          || /^(?:[A-Za-z]:[\\/]|\\\\[^<>:"/\\|?*\r\n]+[\\/][^<>:"/\\|?*\r\n]+[\\/])(?:[^<>:"/\\|?*\r\n]+[\\/])*[^<>:"/\\|?*\r\n]+\.(?:json|md|markdown|txt|csv|tsv|html?|pdf|docx?|xlsx?|pptx?|png|jpe?g|gif|webp|svg|py|js|ts|tsx|jsx|cpp|c|h|hpp|qml|pro|cmake|yml|yaml|xml|log)$/i.test(value)
          || /^(?:\.{1,2}\/)?[A-Za-z0-9_.-]+(?:\/[A-Za-z0-9_.-]+)+\.(?:json|md|markdown|txt|csv|tsv|html?|pdf|docx?|xlsx?|pptx?|png|jpe?g|gif|webp|svg|py|js|ts|tsx|jsx|cpp|c|h|hpp|qml|pro|cmake|yml|yaml|xml|log)$/.test(value)
          || /^[A-Za-z0-9_.-]+\.(?:json|md|markdown|txt|csv|tsv|html?|pdf|docx?|xlsx?|pptx?|png|jpe?g|gif|webp|svg|py|js|ts|tsx|jsx|cpp|c|h|hpp|qml|pro|cmake|yml|yaml|xml|log)$/.test(value);
      }

      function inlineCodeHtml(code) {
        var ref = decodeHtmlText(code).trim();
        if (!isLikelyLocalRef(ref))
          return '<code>' + code + '</code>';
        return '<a href="' + escapeAttr(localLinkHref(ref)) + '" class="local-file-link"><code>'
          + code + '</code></a>';
      }

      function inlineMarkdown(text) {
        var out = escapeHtml(normalizeNumericSpacing(text));
        out = out.replace(/`([^`]+)`/g, function (_, code) { return inlineCodeHtml(code); });
        out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        out = out.replace(/(^|[^\w/])__([^_\s][^_]*?[^_\s])__(?=$|[^\w/])/g, '$1<strong>$2</strong>');
        out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        out = out.replace(/(^|[^\w/])_([^_\s][^_]*?[^_\s])_(?=$|[^\w/])/g, '$1<em>$2</em>');
        out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, label, href) {
          return '<a href="' + escapeAttr(href) + '">' + label + '</a>';
        });
        return protectNumericRuns(out);
      }

      function flushParagraph(buffer, html) {
        if (!buffer.length) return;
        html.push('<p>' + inlineMarkdown(buffer.join(' ')) + '</p>');
        buffer.length = 0;
      }

      function splitTableRow(line) {
        var s = line.trim();
        if (s.charAt(0) === '|') s = s.slice(1);
        if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
        return s.split('|').map(function (cell) { return cell.trim(); });
      }

      function isTableSeparator(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
      }

      function tableCellClass(cell, index) {
        var compact = normalizeNumericSpacing(cell)
          .replace(/[`*_~\[\]()]/g, '')
          .replace(/\s+/g, '');
        return index === 0 || compact.length <= 18 ? ' class="nowrap-cell"' : '';
      }

      function renderList(lines, start, html, ordered) {
        var tag = ordered ? 'ol' : 'ul';
        var pattern = ordered ? /^\s*\d+\.\s+(.+)$/ : /^\s*[-*+]\s+(.+)$/;
        var i = start;
        html.push('<' + tag + '>');
        while (i < lines.length) {
          var match = lines[i].match(pattern);
          if (!match) break;
          html.push('<li>' + inlineMarkdown(match[1]) + '</li>');
          i++;
        }
        html.push('</' + tag + '>');
        return i;
      }

      function renderTable(lines, start, html) {
        var headers = splitTableRow(lines[start]);
        var i = start + 2;
        html.push('<div class="table-wrap"><table><thead><tr>');
        headers.forEach(function (cell) { html.push('<th>' + inlineMarkdown(cell) + '</th>'); });
        html.push('</tr></thead><tbody>');
        while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim() !== '') {
          html.push('<tr>');
          splitTableRow(lines[i]).forEach(function (cell, index) {
            html.push('<td' + tableCellClass(cell, index) + '>' + inlineMarkdown(cell) + '</td>');
          });
          html.push('</tr>');
          i++;
        }
        html.push('</tbody></table></div>');
        return i;
      }

      function renderMarkdown(markdown) {
        var lines = String(markdown || '').replace(/\r\n/g, '\n').split('\n');
        var html = [];
        var paragraph = [];
        var i = 0;

        while (i < lines.length) {
          var line = lines[i];

          if (/^\s*```/.test(line)) {
            flushParagraph(paragraph, html);
            var code = [];
            i++;
            while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
            if (i < lines.length) i++;
            html.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>');
            continue;
          }

          if (/^\s*$/.test(line)) {
            flushParagraph(paragraph, html);
            i++;
            continue;
          }

          if (/^\s*#{1,6}\s+/.test(line)) {
            flushParagraph(paragraph, html);
            var h = line.match(/^\s*(#{1,6})\s+(.+)$/);
            html.push('<h' + h[1].length + '>' + inlineMarkdown(h[2]) + '</h' + h[1].length + '>');
            i++;
            continue;
          }

          if (/^\s*>/.test(line)) {
            flushParagraph(paragraph, html);
            var quote = [];
            while (i < lines.length && /^\s*>/.test(lines[i])) quote.push(lines[i++].replace(/^\s*>\s?/, ''));
            html.push('<blockquote>' + renderMarkdown(quote.join('\n')) + '</blockquote>');
            continue;
          }

          if (/^\s*[-*+]\s+/.test(line)) {
            flushParagraph(paragraph, html);
            i = renderList(lines, i, html, false);
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            flushParagraph(paragraph, html);
            i = renderList(lines, i, html, true);
            continue;
          }

          if (i + 1 < lines.length && line.indexOf('|') !== -1 && isTableSeparator(lines[i + 1])) {
            flushParagraph(paragraph, html);
            i = renderTable(lines, i, html);
            continue;
          }

          if (/^\s*---+\s*$/.test(line)) {
            flushParagraph(paragraph, html);
            html.push('<hr>');
            i++;
            continue;
          }

          paragraph.push(line.trim());
          i++;
        }

        flushParagraph(paragraph, html);
        return html.join('');
      }

      function plainTextHtml(text) {
        return protectNumericRuns(escapeHtml(normalizeNumericSpacing(text)));
      }

      function streamingTextHtml(text) {
        return '<span data-stream-text="true">' + escapeHtml(text) + '</span>';

      function fileNameFromPath(path) {
        var normalized = String(path || '').replace(/[\\/]+$/, '');

      function renderUserContent(text) {
        var value = String(text || '');
        var pattern = /"((?:[A-Za-z]:[\\/]|\\\\|\/)[^"\r\n]+)"/g;
        var html = [];
        var cursor = 0;
        var match;
        while ((match = pattern.exec(value)) !== null) {
          html.push(plainTextHtml(value.slice(cursor, match.index)));
          var path = match[1];
          html.push('<a class="user-file-ref" href="'
            + escapeAttr(localLinkHref(path)) + '" data-file-path="' + escapeAttr(path) + '">'
            + '<span class="user-file-icon"></span>'
            + '<span class="user-file-name">' + escapeHtml(fileNameFromPath(path)) + '</span>'
            + '</a>');
          cursor = match.index + match[0].length;
        }
        html.push(plainTextHtml(value.slice(cursor)));

      function artifactIconPath(file) {
        if (file && (file.isDirectory === true || file.type === 'directory'

      function renderArtifacts(artifacts, row) {

      function isCompactionMarker(msg) {
