      function toolVisuallyComplete(items, index, isRunning) {
        var msg = items[index] || {};
        if (msg.isCancelled === true) return true;
        if (msg.hasToolResult !== true) return false;
        if (msg.isError === true) return true;
        for (var next = index + 1; next < items.length; next++) {
          var following = items[next] || {};
          if (following.msgRole === 'user') return true;
          if (following.msgType === 'question') {
            var questionStatus = String(following.questionStatus || '').toLowerCase();
            if (questionStatus === 'pending' || questionStatus === '') return false;
            return true;
          }
          if (following.msgType === 'toolCall') return true;
          if (following.msgType === 'text' && following.msgRole === 'assistant'
              && String(following.content || '').trim()) return true;
          if (following.msgType === 'toolResult') return true;
        }
        return false;
      }

      function statusIcon(msg, completed) {
        if (!completed) return '<span class="spinner"></span>';
        if (msg.isError) return '<span class="dot error"></span>';
        if (msg.isCancelled === true) return '<span class="dot cancelled"></span>';
        return '<img class="status-icon" src="qrc:///images/toolSuccess.png" alt="">';
      }

      // 提问卡的渲染与交互都在 QML（components/AskUserCard.qml）。
      // 页面只负责：待答时不渲染任何内容；处理完后渲染一行「已回答/已跳过」。
      function renderQuestion(msg, index) {
        var status = String(msg.questionStatus || 'pending').toLowerCase();
        var interactive = status === '' || status === 'pending';
        // 待答问题由 QML 的悬浮卡片承载，消息流里不出现
        if (interactive)
          return '';

        var resultClass = 'question-result';
        var resultLabel = '已回答';
        if (status === 'submitted') {
          resultLabel = '已提交，等待继续';
        } else if (status === 'skipped') {
          resultLabel = '已跳过';
          resultClass += ' warn';
        } else if (status === 'timeout') {
          resultLabel = '等待超时';
          resultClass += ' warn';
        } else if (status === 'aborted') {
          resultLabel = '已取消';
          resultClass += ' warn';
        } else if (status === 'error') {
          resultLabel = '提交失败';
          resultClass += ' err';
        } else {
          resultClass += ' ok';
        }
        return '<div class="' + resultClass + '" data-row="' + index + '">'
          + escapeHtml(resultLabel)
          + (msg.questionAnswer
            ? '：' + escapeHtml(String(msg.questionAnswer))
            : '')
          + '</div>';
      }

      function isThoughtAside(row, items) {
        items = items || messages;
        var msg = items[row] || {};
        if (msg.msgType !== 'text' || msg.msgRole !== 'assistant'
            || msg.isIntermediate !== true) return false;
        var hasCompletedTool = false;
        for (var i = row - 1; i >= 0; i--) {
          var previous = items[i] || {};
          if (previous.msgRole === 'user') break;
          if (previous.msgType === 'text' && previous.msgRole === 'assistant'
              && previous.isIntermediate === true) continue;
          if (previous.msgType === 'toolCall') {
            if (previous.hasToolResult === true) hasCompletedTool = true;
            continue;
          }
          break;
        }
        if (!hasCompletedTool) return false;
        for (var j = row + 1; j < items.length; j++) {
          var next = items[j] || {};
          if (next.msgRole === 'user') return false;
          if (next.msgType === 'toolCall') return true;
          if (next.msgType === 'question') return false;
          if (next.msgType === 'text' && next.msgRole === 'assistant') {
            if (next.isIntermediate === true) continue;
            if (!String(next.content || '').trim()) continue;
            return false;
          }
        }
        return false;
      }

      function isThoughtItem(msg, row, items) {
        if (!msg) return false;
        return msg.msgType === 'toolCall'
          || (msg.msgType === 'text' && msg.msgRole === 'assistant'
              && msg.isIntermediate === true && !isThoughtAside(row, items));
      }

      function thoughtGroupRange(row) {
        if (!isThoughtItem(messages[row], row)) return null;
        var start = row;
        var end = row;
        while (start > 0 && isThoughtItem(messages[start - 1], start - 1)) start--;
        while (end + 1 < messages.length && isThoughtItem(messages[end + 1], end + 1)) end++;
        return { start: start, end: end };
      }

      function isLastThoughtGroup(range) {
        for (var i = range.end + 1; i < messages.length; i++) {
          if (isThoughtItem(messages[i], i)) return false;
        }
        return true;
      }

      function thoughtGroupIsActive(range) {
        if (!conversationRunning || turnStartIndex(range.start) !== lastUserMessageIndex())
          return false;
        for (var i = range.end + 1; i < messages.length; i++) {
          var msg = messages[i] || {};
          if (msg.msgRole === 'user') break;
          if (msg.msgType === 'question') return false;
          if (isThoughtAside(i)) return false;
          if (msg.msgType === 'text' && msg.msgRole === 'assistant') {
            if (msg.isStreaming || String(msg.content || '').trim()) return false;
          }
        }
        return true;
      }

      function latestActiveThoughtGroup() {
        var last = null;
        var userRow = lastUserMessageIndex();
        if (!conversationRunning || userRow < 0) return null;
        for (var i = userRow + 1; i < messages.length; i++) {
          if (!isThoughtItem(messages[i], i)) continue;
          var range = thoughtGroupRange(i);
          if (range && range.start === i && thoughtGroupIsActive(range))
            last = range;
          if (range) i = range.end;
        }
        return last;
      }

      function thoughtGroupKey(start) {
        var range = thoughtGroupRange(start);
        return 'thought:' + turnStartIndex(start) + ':row:'
          + (range ? range.start : start);
      }

      function renderThoughtGroup(start) {
        var range = thoughtGroupRange(start);
        if (!range || range.start !== start) return '';
        var key = thoughtGroupKey(start);
        var hasError = false;
        for (var errorRow = range.start; errorRow <= range.end; errorRow++) {
          var errorMessage = messages[errorRow] || {};
          if (errorMessage.msgType === 'toolCall' && errorMessage.isError === true) {
            hasError = true;
            break;
          }
        }
        var latestActive = latestActiveThoughtGroup();
        var expanded = Object.prototype.hasOwnProperty.call(expandedThoughts, key)
          ? expandedThoughts[key] === true
          : (hasError || (latestActive
              ? latestActive.start === range.start : isLastThoughtGroup(range)));
        var bodyId = 'thought-body-' + start;
        var html = [];
        var active = conversationRunning
          && turnStartIndex(range.start) === lastUserMessageIndex()
          && thoughtGroupIsActive(range);
        var busy = false;
        if (active) {
          for (var activeRow = range.start; activeRow <= range.end; activeRow++) {
            var activeTool = messages[activeRow] || {};
            if (activeTool.msgType === 'toolCall'
                && !toolVisuallyComplete(messages, activeRow, conversationRunning)) {
              busy = true;
              break;
            }
          }
        }
        html.push('<section class="message assistant thought-group" data-row="' + start
          + '" data-thought-start="' + start + '">');
        html.push('<button class="thought-header" type="button" data-thought-key="'
          + escapeAttr(key) + '" aria-controls="' + bodyId + '" aria-expanded="'
          + (expanded ? 'true' : 'false') + '">');
        html.push(((active || busy)
            ? '<span class="thought-status"><span class="spinner"></span></span>' : '')
          + '<span class="thought-title">深度思考</span>'
          + '<span class="thought-arrow" aria-hidden="true">›</span></button>');
        html.push('<div class="thought-body" id="' + bodyId + '"'
          + (expanded ? '' : ' hidden') + '>');
        for (var i = range.start; i <= range.end; i++) {
          var msg = messages[i] || {};
          if (msg.msgType === 'toolCall') {
            html.push(renderToolCall(msg, i));
          } else if (msg.msgType === 'text') {
            var body = msg.isStreaming
              ? streamingTextHtml(msg.content || '') : renderMarkdown(msg.content || '');
            html.push('<div class="thought-text markdown-body'
              + (msg.isIntermediate ? ' intermediate' : '')
              + '" data-content-row="' + i + '" data-thought-row="' + i
              + '">' + body + '</div>');
          }
        }
        html.push('</div></section>');
        return html.join('');
      }

      function renderToolCall(msg, index) {
        var completed = toolVisuallyComplete(messages, index, conversationRunning);
        var hasOutput = String(msg.toolResultText || '').length > 0;
        var isResult = completed || hasOutput;
        var detail = isResult ? msg.toolResultText : msg.toolArgs;
        var key = toolKey(msg, index);
        var expanded = Object.prototype.hasOwnProperty.call(expandedTools, key)
          ? expandedTools[key] === true : msg.isError === true;
        var title = toolTitle(msg.toolName);
        var meta = (completed || hasOutput) ? toolMetaText(msg.toolResultText) : '';
        var html = [];
        html.push('<div class="tool" data-row="' + index + '">');
        html.push('<div class="tool-header" data-tool-key="' + escapeAttr(key)
          + '" role="button" tabindex="0" aria-expanded="' + (expanded ? 'true' : 'false') + '">');
        html.push('<span class="status-slot">' + statusIcon(msg, completed) + '</span>');
        html.push('<span class="tool-name">' + escapeHtml(title) + '</span>');
        if (meta) html.push('<span class="tool-meta">' + escapeHtml(meta) + '</span>');
        html.push('<span class="tool-arrow" aria-hidden="true">' + (expanded ? '▾' : '▸') + '</span>');
        html.push('</div>');
        var detailText = isResult
          ? cleanToolText(detail || '')
          : humanizeToolArgs(msg.toolName, detail || '');
        if (expanded && String(detailText).length > 0)
          html.push('<div class="tool-detail-text' + (msg.isError ? ' error' : '')
            + (completed || hasOutput ? '" data-tool-result-row="' + index : '') + '">'
            + plainTextHtml(detailText) + '</div>');
        html.push('</div>');
        return html.join('');
      }

      // 一条工具结果压成一行摘要，供折叠状态显示
      function summarizeToolContent(toolName, text) {
        var t = String(text || "");
        if (!t.trim()) return "";
        var w = t.match(/Successfully wrote (\d+) bytes to ([^\r\n]+)/);
        if (w) return "已写入 " + argBasename(w[2].trim()) + "（" + w[1] + " 字节）";
        var r = t.match(/Successfully replaced text in ([^\r\n]+)/);
        if (r) return "已修改 " + argBasename(r[1].trim());
        // PowerShell / dir 的 FullName+Length 表格
        if (/FullName/.test(t) && /Length/.test(t) && /-{4,}/.test(t)) {
          var paths = t.match(/[A-Za-z]:\\[^\r\n]+/g) || [];
          var names = [];
          for (var i = 0; i < paths.length; i++) {
            var cell = paths[i].trim().split(/\s{2,}/)[0];
            var nm = argBasename(cell);
            if (nm && names.indexOf(nm) < 0) names.push(nm);
          }
          if (names.length)
            return "列出 " + names.length + " 项：" + names.slice(0, 5).join("、")
                   + (names.length > 5 ? "…" : "");
          return "目录列表";
        }
        // JSON 内容（read 之类）
        var trimmed = t.trim();
        if (trimmed.charAt(0) === "{" || trimmed.charAt(0) === "[") {
          try {
            var parsed = JSON.parse(trimmed);
            if (parsed && typeof parsed === "object") {
              var n = Array.isArray(parsed) ? parsed.length : Object.keys(parsed).length;
              return (Array.isArray(parsed) ? "数组" : "JSON") + " · " + n + " 项";
            }
          } catch (e) { /* 不是 JSON，走兜底 */ }
        }
        var first = trimmed.split(/\r?\n/).filter(function (s) { return s.trim(); })[0] || "";
        return first.length > 40 ? first.slice(0, 40) + "…" : first;
      }

      // 孤立 toolResult：默认收起，只显示「标题 + 一行摘要」，点开才看原文
      function renderOrphanToolResult(msg, index) {
        var key = toolKey(msg, index);
        var expanded = Object.prototype.hasOwnProperty.call(expandedTools, key)
          ? expandedTools[key] === true : false;
        var summary = summarizeToolContent(msg.toolName, msg.content);
        var html = [];
        html.push('<div class="message" data-row="' + index + '">');
        html.push('<div class="tool">');
        html.push('<div class="tool-header" data-tool-key="' + escapeAttr(key)
          + '" role="button" tabindex="0" aria-expanded="' + (expanded ? 'true' : 'false') + '">');
        html.push('<span class="status-slot">' + statusIcon({ isError: msg.isError }, true) + '</span>');
        html.push('<span class="tool-name">' + escapeHtml(toolTitle(msg.toolName)) + '</span>');
        if (summary) html.push('<span class="tool-meta">' + escapeHtml(summary) + '</span>');
        html.push('<span class="tool-arrow" aria-hidden="true">' + (expanded ? '▾' : '▸') + '</span>');
        html.push('</div>');
        if (expanded)
          html.push('<div class="tool-detail-text' + (msg.isError ? ' error' : '') + '">'
            + plainTextHtml(cleanToolText(msg.content || '')) + '</div>');
        html.push('</div>');
        html.push('</div>');
        return html.join('');
      }

      function renderTextMessage(msg, index) {
        var isUser = msg.msgRole === 'user';
        var isAside = !isUser && isThoughtAside(index);
        var classes = 'bubble ' + (isUser ? 'user' : 'assistant markdown-body');
        if (msg.isIntermediate && !isAside) classes += ' intermediate';
        if (isAside) classes += ' aside';
        var body = '';
        if (isUser)
          body = renderUserContent(msg.content || '');
        else if (msg.isStreaming)
          body = streamingTextHtml(msg.content || '');
        else
          body = renderMarkdown(msg.content || '');
        return '<div class="message ' + (isUser ? 'user' : 'assistant')
          + (isAside ? ' thought-aside' : '') + '" data-row="' + index + '">'
          + '<div class="' + classes + '" data-content-row="' + index + '">' + body + '</div>'
          + '</div>';
      }

      // 产物清单按「轮」渲染，而不是挂在哪条 assistant 消息上：
      //   1) 位置：挂在**本轮最后一条消息**之后 —— 否则产物是在轮次中途被检测到的，
      //      会停在半截（后面还跟着 process/exec 之类的工具卡片）；
      //   2) 时机：本轮还在跑就先不显示，等 conversationRunning 变回 false 再显示；
      //   3) 内容：聚合整轮内所有消息上的 artifacts。
      function turnStartIndex(index) {
        for (var i = index; i >= 0; i--) {
          if (messages[i] && messages[i].msgRole === 'user')
            return i;
        }
        return -1;
      }

      function lastUserMessageIndex() {
        for (var i = messages.length - 1; i >= 0; i--) {
          if (messages[i] && messages[i].msgRole === 'user')
            return i;
        }
        return -1;
      }

      function artifactsForTurn(index) {
        var start = turnStartIndex(index);
        var out = [];
        var seen = {};
        for (var i = start + 1; i < messages.length; i++) {
          var m = messages[i] || {};
          if (m.msgRole === 'user')
            break;
          var list = Array.isArray(m.artifacts) ? m.artifacts : [];
          for (var j = 0; j < list.length; j++) {
            var file = list[j] || {};
            var key = String(file.path || file.name || (i + ':' + j));
            if (seen[key])
              continue;
            seen[key] = true;
            out.push(file);
          }
        }
        return out;
      }

      /** 本轮之前已经出现过的产物路径（用于判断"本轮到底有没有新东西"） */
      function priorArtifactPaths(startIndex) {
        var seen = {};
        for (var i = 0; i < startIndex; i++) {
          var list = (messages[i] && messages[i].artifacts) || [];
          for (var j = 0; j < list.length; j++) {
            var key = String((list[j] || {}).path || '');
            if (key)
              seen[key] = true;
          }
        }
        return seen;
      }

      /** 本轮工具是否都已返回（有未完成的 toolCall 就先不收盘） */
      function turnToolsFinished(startIndex) {
        for (var i = startIndex + 1; i < messages.length; i++) {
          var item = messages[i] || {};
          if (item.msgRole === 'user')
            break;
          if (item.msgType === 'toolCall' && !item.hasToolResult)
            return false;
        }
        return true;
      }

      /**
       * 本轮「值得显示」的产物：只保留本轮新增或被改动的文件。
       * 客户端偶尔会把同一批产物重复挂到后续轮次（检测快照未按轮刷新），
       * 这里再兜一层：全都在更早轮次出现过、且没有 modified 标记的，一律不算。
       */
      function turnArtifactsForDisplay(index) {
        var artifacts = artifactsForTurn(index);
        if (artifacts.length === 0)
          return [];
        var prior = priorArtifactPaths(turnStartIndex(index));
        var fresh = [];
        for (var i = 0; i < artifacts.length; i++) {
          var file = artifacts[i] || {};
          var path = String(file.path || '');
          var changeType = String(file.changeType || '');
          if (!prior[path] || changeType === 'modified')
            fresh.push(file);
        }
        return fresh;
      }

      /**
       * 轮尾块：「✓ 任务完成」+ 产物清单。
       * 两者都只在**本轮真的有产物**时出现——闲聊轮次既不打完成标记，也不出清单。
       */
      function turnTailHtml(index) {
        var next = messages[index + 1];
        if (isThoughtAside(index))
          return '';
        if (next && next.msgRole !== 'user')
          return '';
        var start = turnStartIndex(index);
        if (conversationRunning && start === lastUserMessageIndex())
          return '';
        if (!turnToolsFinished(start))
          return '';
        var artifacts = turnArtifactsForDisplay(index);
        // 上游的 conversationEndLabel：任务被结束/中止时给的是另一句文案与图标
        var label = conversationEndLabel || '';
        if (artifacts.length === 0 && !label)
          return '';
        var icon = label
          ? '<span class="task-ended-icon" aria-hidden="true"></span>'
          : '<img class="status-icon" src="qrc:///images/missonSuccess.png" alt="">';
        // 必须包在 .message 里：它带 max-width:840px 与居中，块才和正文同宽。
        return '<div class="message assistant artifact-turn">'
          + '<div class="task-complete"><span class="status-slot">' + icon + '</span>'
          + '<span>' + (label || '任务完成') + '</span></div>'
          + (artifacts.length ? renderArtifacts(artifacts, index) : '')
          + '</div>';
      }

      function renderMessage(msg, index) {
        msg = msg || {};
        if (isCompactionMarker(msg))
          return '<div class="message compaction" data-row="' + index + '"></div>';
        if (msg.msgType === 'question')
          return renderQuestion(msg, index) + turnTailHtml(index);
        if (isThoughtItem(msg, index)) {
          var range = thoughtGroupRange(index);
          if (range && range.start !== index) return '';
          return renderThoughtGroup(index) + turnTailHtml(range ? range.end : index);
        }
        if (isThoughtAside(index))
          return renderTextMessage(msg, index) + turnTailHtml(index);
        if (msg.msgType === 'toolCall')
          return renderToolCall(msg, index) + turnTailHtml(index);
        if (msg.msgType === 'toolResult')
          return renderOrphanToolResult(msg, index) + turnTailHtml(index);
        return renderTextMessage(msg, index) + turnTailHtml(index);
      }

      function scrollToBottom() {
        app.scrollTop = app.scrollHeight;
        updateScrollToBottomButton();
        updateActiveTurn();
      }

      function isAtBottom() {
        return app.scrollHeight - app.clientHeight - app.scrollTop <= 2;
      }

      function updateScrollToBottomButton() {
        scrollToBottomButton.hidden = isAtBottom();
      }

      function toolKey(msg, index) {
        return (msg.toolCallId && String(msg.toolCallId).length > 0)
          ? 'id:' + msg.toolCallId
          : 'idx:' + index;
      }

      function turnLabel(msg) {
        var text = String((msg && msg.content) || '')
          .replace(/\s+/g, ' ').trim();
        if (!text) return '对话';
        return text.length > 34 ? text.slice(0, 34) + '…' : text;
      }

      function rebuildTurnNav() {
        hideTurnTooltip();
        var html = [];
        var signature = [];
        for (var i = 0; i < messages.length; i++) {
          var msg = messages[i] || {};
          if (msg.msgRole !== 'user' || msg.msgType === 'toolCall'
              || msg.msgType === 'toolResult')
            continue;
          var label = turnLabel(msg);
          signature.push(i + ':' + label);
          html.push('<button class="turn-nav-item" type="button" data-turn-row="'
            + i + '" data-turn-label="' + escapeAttr(label)
            + '" aria-label="跳转到：' + escapeAttr(label) + '">');
          html.push('<span class="turn-nav-mark" aria-hidden="true"></span>');
          html.push('</button>');
        }
        signature = signature.join('|');
        if (signature === turnNavSignature) {
          updateActiveTurn();
          return;
        }
        turnNavSignature = signature;
        turnNav.innerHTML = html.join('');
        turnNav.hidden = html.length === 0;
        activeTurnRow = -1;
        updateActiveTurn();
      }

      function updateActiveTurn() {
        if (!turnNav || turnNav.hidden) return;
        var rows = turnNav.querySelectorAll('[data-turn-row]');
        if (!rows.length) return;
        var appTop = app.getBoundingClientRect().top;
        var threshold = appTop + Math.min(120, app.clientHeight * .28);
        var selected = Number(rows[0].getAttribute('data-turn-row'));
        for (var i = 0; i < rows.length; i++) {
          var row = Number(rows[i].getAttribute('data-turn-row'));
          var messageNode = app.querySelector(':scope > [data-row="' + row + '"]');
          if (messageNode && messageNode.getBoundingClientRect().top <= threshold)
            selected = row;
          else if (messageNode)
            break;
        }
        if (isNearBottom())
          selected = Number(rows[rows.length - 1].getAttribute('data-turn-row'));
        if (activeTurnRow === selected) return;
        activeTurnRow = selected;
        for (var j = 0; j < rows.length; j++)
          rows[j].classList.toggle('active', Number(rows[j].getAttribute('data-turn-row')) === selected);
      }

      function jumpToTurn(row) {
        var node = app.querySelector(':scope > [data-row="' + row + '"]');
        if (!node) return;
        var targetTop = app.scrollTop + node.getBoundingClientRect().top
          - app.getBoundingClientRect().top - 12;
        if (app.scrollTo)
          app.scrollTo({ top: targetTop, behavior: 'smooth' });
        else
          app.scrollTop = targetTop;
        activeTurnRow = -1;
        updateActiveTurn();
      }

      function showTurnTooltip(turn) {
        if (!turnNavTooltip || !turn) return;
        var label = turn.getAttribute('data-turn-label') || '';
        if (!label) return;
        var rect = turn.getBoundingClientRect();
        turnNavTooltip.textContent = label;
        turnNavTooltip.style.left = Math.round(rect.right + 8) + 'px';
        turnNavTooltip.style.top = Math.round(rect.top + rect.height / 2) + 'px';
        turnNavTooltip.classList.add('visible');
        turnNavTooltip.setAttribute('aria-hidden', 'false');
      }

      function hideTurnTooltip() {
        if (!turnNavTooltip) return;
        turnNavTooltip.classList.remove('visible');
        turnNavTooltip.setAttribute('aria-hidden', 'true');
      }

      function isNearBottom() {
        return app.scrollHeight - app.clientHeight - app.scrollTop <= 80;
      }

      function captureViewport() {
        var appTop = app.getBoundingClientRect().top;
        var nodes = app.querySelectorAll(':scope > [data-row]');
        for (var i = 0; i < nodes.length; i++) {
          var rect = nodes[i].getBoundingClientRect();
          if (rect.bottom > appTop) {
            return {
              row: nodes[i].getAttribute('data-row'),
              offset: rect.top - appTop,
              scrollTop: app.scrollTop
            };
          }
        }
        return { row: null, offset: 0, scrollTop: app.scrollTop };
      }

      function restoreViewport(viewport, followBottom) {
        if (followBottom) {
          scrollToBottom();
          return;
        }
        if (viewport && viewport.row !== null) {
          var anchor = app.querySelector(':scope > [data-row="' + viewport.row + '"]');
          if (anchor) {
            var appTop = app.getBoundingClientRect().top;
            app.scrollTop += anchor.getBoundingClientRect().top - appTop - viewport.offset;
            return;
          }
        }
        app.scrollTop = viewport ? viewport.scrollTop : app.scrollTop;
      }

      function messageEquals(a, b) {
        if (!a || !b) return a === b;
        return a.msgRole === b.msgRole
          && a.msgType === b.msgType
          && a.content === b.content
          && a.toolName === b.toolName
          && a.toolArgs === b.toolArgs
          && a.toolCallId === b.toolCallId
          && a.isError === b.isError
          && a.toolResultText === b.toolResultText
          && a.hasToolResult === b.hasToolResult
          && a.isCancelled === b.isCancelled
          && a.isStreaming === b.isStreaming
          && a.isIntermediate === b.isIntermediate
          && JSON.stringify(a.artifacts || []) === JSON.stringify(b.artifacts || [])
          && a.questionId === b.questionId
          && a.questionText === b.questionText
          && a.questionHeader === b.questionHeader
          && JSON.stringify(a.questionOptions || []) === JSON.stringify(b.questionOptions || [])
          && a.questionMulti === b.questionMulti
          && a.questionAllowText === b.questionAllowText
          && a.questionStatus === b.questionStatus
          && a.questionAnswer === b.questionAnswer;
      }

      function replaceMessageRow(row) {
        var node = app.querySelector(':scope > [data-row="' + row + '"]');
        if (!node) {
          var thoughtGroups = app.querySelectorAll(':scope > .thought-group[data-thought-start]');
          for (var i = 0; i < thoughtGroups.length; i++) {
            var rowMessage = messages[row] || {};
            if (rowMessage.msgType === 'toolCall') {
              var toolHeader = thoughtGroups[i].querySelector('[data-tool-key="'
                + escapeAttr(toolKey(rowMessage, row)) + '"]');
              if (toolHeader) {
                node = toolHeader.parentNode;
                break;
              }
            } else {
              var thoughtRow = thoughtGroups[i].querySelector('[data-thought-row="' + row + '"]');
              if (thoughtRow) {
                node = thoughtRow;
                break;
              }
            }
          }
        }
        if (!node) return false;
        if (hoveredFile && node.contains(hoveredFile))
          clearFileHover();
        if (node.classList.contains('tool')) {
          node.outerHTML = renderToolCall(messages[row], row);
        } else if (node.classList.contains('thought-text')) {
          var hiddenThoughtBody = node.closest('.thought-body[hidden]');
          if (hiddenThoughtBody) return true;
          var msg = messages[row] || {};
          node.innerHTML = msg.isStreaming
            ? streamingTextHtml(msg.content || '') : renderMarkdown(msg.content || '');
        } else {
          node.outerHTML = renderMessage(messages[row], row);
        }
        return true;
      }

      function scrollToolResultToBottom(row) {
        var node = app.querySelector('[data-tool-result-row="' + row + '"]');
        if (!node) return;
        node.scrollTop = node.scrollHeight;
        requestAnimationFrame(function () {
          if (node.isConnected)
            node.scrollTop = node.scrollHeight;
        });
      }

      function revealToolResult(row, text, followBottom) {
        var node = app.querySelector('[data-tool-result-row="' + row + '"]');
        if (!node) return;
        var value = String(text || '');
        var parts = value.match(/[^\n]*\n|[^\n]+$/g) || [];
        if (parts.length === 1 && value.length > 120) {
          parts = [];
          for (var offset = 0; offset < value.length; offset += 120)
            parts.push(value.slice(offset, offset + 120));
        }
        if (parts.length <= 1) return;

        var batchSize = Math.max(1, Math.ceil(parts.length / 30));
        var shown = '';
        var cursor = 0;
        node.innerHTML = '';
        function appendBatch() {
          if (!node.isConnected) return;
          for (var count = 0; count < batchSize && cursor < parts.length; count++)
            shown += parts[cursor++];
          node.innerHTML = plainTextHtml(cleanToolText(shown));
          node.scrollTop = node.scrollHeight;
          if (followBottom) scrollToBottom();
          if (cursor < parts.length)
            setTimeout(appendBatch, 45);
        }
        appendBatch();
      }

      function patchMessages(nextMessages, followBottom) {
        if (nextMessages.length < messages.length)
          return false;

        // A thought group can span several model rows. Rebuild the conversation
        // when its boundaries change so a text/tool row is never duplicated or
        // left outside the group after an incremental update.
        if (nextMessages.length > messages.length && messages.length
            && (isThoughtItem(messages[messages.length - 1], messages.length - 1)
                || isThoughtAside(messages.length - 1)))
          return false;

        var changed = [];
        var sharedCount = Math.min(messages.length, nextMessages.length);
        for (var i = 0; i < sharedCount; i++) {
          if (isThoughtItem(messages[i], i, messages)
                !== isThoughtItem(nextMessages[i], i, nextMessages)
              || isThoughtAside(i, messages) !== isThoughtAside(i, nextMessages))
            return false;
          var dataChanged = !messageEquals(messages[i], nextMessages[i]);
          var visualStateChanged = (messages[i] || {}).msgType === 'toolCall'
            && toolVisuallyComplete(messages, i, conversationRunning)
              !== toolVisuallyComplete(nextMessages, i, conversationRunning);
          if (dataChanged || visualStateChanged)
            changed.push(i);
        }

        // A large change is normally a history/session reload. Full rendering is
        // cheaper and less error-prone than replacing many detached DOM rows.
        if (changed.length > 8 || nextMessages.length - messages.length > 8)
          return false;

        var previousMessages = messages;
        messages = nextMessages;
        for (var j = 0; j < changed.length; j++) {
          var changedRow = changed[j];
          var before = previousMessages[changedRow] || {};
          var after = messages[changedRow] || {};
          var beforeCompleted = before.msgType === 'toolCall'
            && toolVisuallyComplete(previousMessages, changedRow, conversationRunning);
          var afterCompleted = after.msgType === 'toolCall'
            && toolVisuallyComplete(messages, changedRow, conversationRunning);
          if (!beforeCompleted && afterCompleted
              && (after.isError === true || !userControlledTools[toolKey(after, changedRow)]))
            expandedTools[toolKey(after, changedRow)] = after.isError === true;
          var groupRange = after.msgType === 'toolCall'
            ? thoughtGroupRange(changedRow) : null;
          if (groupRange && after.isError === true) {
            var groupKey = thoughtGroupKey(groupRange.start);
            expandedThoughts[groupKey] = true;
          }
          var groupNode = groupRange
            ? app.querySelector(':scope > .thought-group[data-thought-start="'
                + groupRange.start + '"]') : null;
          var needsGroupStatusRefresh = groupRange && groupNode
            && (beforeCompleted !== afterCompleted
                || before.isError !== after.isError);
          var updated = false;
          if (needsGroupStatusRefresh) {
            groupNode.outerHTML = renderThoughtGroup(groupRange.start);
            updated = true;
          }
          if (!groupNode || !needsGroupStatusRefresh)
            updated = replaceMessageRow(changedRow);
          if (!updated && groupNode) updated = true;
          if (!updated)
            return false;
          if (after.msgType === 'toolCall'
              && !afterCompleted
              && String(after.toolResultText || '').length > 0)
            scrollToolResultToBottom(changedRow);
          if (after.msgType === 'toolCall'
              && !beforeCompleted && afterCompleted
              && String(before.toolResultText || '').length === 0
              && String(after.toolResultText || '').length > 0)
            revealToolResult(changedRow, after.toolResultText, followBottom);
          else if (after.msgType === 'toolCall'
                   && String(after.toolResultText || '').length > 0)
            scrollToolResultToBottom(changedRow);
        }
        if (messages.length > sharedCount) {
          var previousTail = sharedCount > 0 ? sharedCount - 1 : -1;
          if (previousTail >= 0 && (isThoughtItem(messages[previousTail], previousTail)
              || isThoughtAside(previousTail)))
            return false;
          for (var row = sharedCount; row < messages.length; row++)
            app.insertAdjacentHTML('beforeend', renderMessage(messages[row], row));
        }
        return true;
      }

      function markScrolling(node) {
        if (!node || !node.classList) return;
        node.classList.add('scrolling');
        if (node._scrollHideTimer)
          clearTimeout(node._scrollHideTimer);
        node._scrollHideTimer = setTimeout(function () {
          node.classList.remove('scrolling');
          node._scrollHideTimer = null;
        }, 850);
      }

      function renderAll(shouldScrollToBottom, viewport) {
        clearFileHover();
        var token = ++renderToken;
        var index = 0;
        var htmlParts = [];

        function renderBatch() {
          if (token !== renderToken)
            return;

          var html = [];
          var chars = 0;
          var count = 0;
          while (index < messages.length && count < 24 && chars < 120000) {
            var piece = renderMessage(messages[index], index);
            html.push(piece);
            chars += piece.length;
            index++;
            count++;
          }

          if (html.length)
            htmlParts.push(html.join(''));

          if (index < messages.length) {
            setTimeout(renderBatch, 0);
            return;
          }

          // Build large histories off-screen first. The prior implementation
          // inserted every batch into #app, changing scrollHeight repeatedly
          // before the final scroll-to-bottom and making the thumb jump.
          app.innerHTML = htmlParts.join('');
          rebuildTurnNav();
          requestAnimationFrame(function () {
            if (token === renderToken) {
              restoreViewport(viewport, shouldScrollToBottom);
              updateScrollToBottomButton();
              updateActiveTurn();
            }
          });
        }

        renderBatch();
      }

      window.MedClawChat = {
        setTheme: function (theme) {
          var el = document.documentElement;
          if (theme === 'dark') { el.setAttribute('data-theme', 'dark'); }
          else { el.removeAttribute('data-theme'); }
        },
        debugRenderQuestion: function (msg) { return renderQuestion(msg, 1); },
        debugState: function () {
          return {
            msgCount: messages.length,
            types: messages.map(function (m) { return m && m.msgType; }),
          };
        },
        setMessages: function (items, forceFullRender, isConversationRunning, endLabel) {
          var nextMessages = Array.isArray(items) ? items : [];
          // Keep the optimistic "submitted" state while the server is still
          // reporting "pending" (the answer round-trip hasn't landed yet).
          var previousQuestions = {};
          for (var qi = 0; qi < messages.length; qi++) {
            var previous = messages[qi] || {};
            if (previous.questionId)
              previousQuestions[previous.questionId] = previous;
          }
          for (var qj = 0; qj < nextMessages.length; qj++) {
            var incoming = nextMessages[qj] || {};
            if (!incoming.questionId) continue;
            var local = previousQuestions[incoming.questionId];
            if (local && local.questionStatus === 'submitted'
                && (!incoming.questionStatus || incoming.questionStatus === 'pending'))
              incoming.questionStatus = 'submitted';
          }
          var nextRunning = isConversationRunning === true;
          var runningChanged = conversationRunning !== nextRunning;
          var nextEndLabel = String(endLabel || '');
          var endLabelChanged = conversationEndLabel !== nextEndLabel;
          if (runningChanged && !nextRunning) {
            for (var thoughtRow = 0; thoughtRow < messages.length; thoughtRow++) {
              if (!isThoughtItem(messages[thoughtRow], thoughtRow)) continue;
              var thoughtRange = thoughtGroupRange(thoughtRow);
              if (!thoughtRange || thoughtRange.start !== thoughtRow) continue;
              var thoughtKey = thoughtGroupKey(thoughtRow);
              var hasThoughtError = false;
              var hasPendingError = false;
              for (var errorRow = thoughtRange.start; errorRow <= thoughtRange.end; errorRow++) {
                var thoughtMessage = messages[errorRow] || {};
                if (thoughtMessage.msgType === 'toolCall') {
                  if (thoughtMessage.isError === true) hasThoughtError = true;
                  else if (thoughtMessage.hasToolResult !== true) hasPendingError = true;
                }
              }
              if (hasThoughtError) expandedThoughts[thoughtKey] = true;
              else if (!hasPendingError && !userControlledThoughts[thoughtKey])
                delete expandedThoughts[thoughtKey];
              thoughtRow = thoughtRange.end;
            }
          }
          conversationRunning = nextRunning;
          conversationEndLabel = nextEndLabel;
          if (forceFullRender) {
            expandedTools = {};
            expandedThoughts = {};
            userControlledThoughts = {};
            userControlledTools = {};
          }
          var followBottom = messages.length === 0 || isNearBottom();
          var viewport = followBottom ? null : captureViewport();
          if (forceFullRender || runningChanged || endLabelChanged
              || !patchMessages(nextMessages, followBottom)) {
            messages = nextMessages;
            renderAll(followBottom, viewport);
            return;
          }
          rebuildTurnNav();
          restoreViewport(viewport, followBottom);
          updateScrollToBottomButton();
        },
        appendStreamDelta: function (row, delta) {
          row = Number(row);
          if (!messages[row]) return;
          var followBottom = isNearBottom();
          var viewport = followBottom ? null : captureViewport();
          messages[row].content = String(messages[row].content || '') + String(delta || '');
          messages[row].isStreaming = true;
          var thoughtRow = app.querySelector('[data-thought-row="' + row + '"]');
          if (thoughtRow) {
            if (thoughtRow.offsetParent !== null)
              thoughtRow.innerHTML = streamingTextHtml(messages[row].content || '');
            restoreViewport(viewport, followBottom);
            updateScrollToBottomButton();
            return;
          }
          var node = app.querySelector('[data-content-row="' + row + '"]');
          if (!node) {
            renderAll(followBottom, viewport);
            return;
          }
          var streamNode = node.querySelector('[data-stream-text]');
          if (!streamNode) {
            node.innerHTML = streamingTextHtml(messages[row].content || '');
          } else if (streamNode.firstChild && streamNode.firstChild.nodeType === 3) {
            streamNode.firstChild.appendData(String(delta || ''));
          } else {
            streamNode.appendChild(document.createTextNode(String(delta || '')));
          }
          restoreViewport(viewport, followBottom);
          updateScrollToBottomButton();
        },
        appendToolDelta: function (row, delta) {
          row = Number(row);
          if (!messages[row] || messages[row].msgType !== 'toolCall') return;
          var value = String(delta || '');
          if (!value) return;
          var followBottom = isNearBottom();
          var viewport = followBottom ? null : captureViewport();
          messages[row].toolResultText = String(messages[row].toolResultText || '') + value;
          var toolKeyValue = toolKey(messages[row], row);
          var node = app.querySelector('[data-tool-result-row="' + row + '"]');
          if (!node) {
            // Results remain tucked away until the user opens the tool row.
            // If it is already open, create its detail node with the latest
            // accumulated output without rebuilding the whole conversation.
            var expanded = Object.prototype.hasOwnProperty.call(expandedTools, toolKeyValue)
              ? expandedTools[toolKeyValue] === true : messages[row].isError === true;
            if (expanded) {
              replaceMessageRow(row);
              node = app.querySelector('[data-tool-result-row="' + row + '"]');
            }
            if (node) {
              node.innerHTML = plainTextHtml(cleanToolText(messages[row].toolResultText || ''));
              node.scrollTop = node.scrollHeight;
            }
            restoreViewport(viewport, followBottom);
            updateScrollToBottomButton();
            return;
          }
          if (node.lastChild && node.lastChild.nodeType === 3)
            node.lastChild.appendData(value);
          else
            node.appendChild(document.createTextNode(value));
          node.scrollTop = node.scrollHeight;
          requestAnimationFrame(function () {
            if (!node.isConnected) return;
            node.scrollTop = node.scrollHeight;
            restoreViewport(viewport, followBottom);
            updateScrollToBottomButton();
          });
          restoreViewport(viewport, followBottom);
          updateScrollToBottomButton();
        },
        refreshToolCall: function (row, updatedMessage) {
          row = Number(row);
          if (!messages[row] || messages[row].msgType !== 'toolCall'
              || !updatedMessage || updatedMessage.msgType !== 'toolCall') return;
          var followBottom = isNearBottom();
          var viewport = followBottom ? null : captureViewport();
          var msg = updatedMessage;
          var wasCompleted = messages[row].hasToolResult === true;
          messages[row] = updatedMessage;
          var completed = toolVisuallyComplete(messages, row, conversationRunning);
          var key = toolKey(msg, row);
            if (completed && !wasCompleted && !userControlledTools[key])
            expandedTools[key] = false;
          if (completed && msg.isError === true) {
            expandedTools[key] = true;
            var errorRange = thoughtGroupRange(row);
            if (errorRange) expandedThoughts[thoughtGroupKey(errorRange.start)] = true;
          }
          var range = thoughtGroupRange(row);
          var groupActive = range && thoughtGroupIsActive(range);
          var isLatestActiveGroup = groupActive
            && latestActiveThoughtGroup()
            && latestActiveThoughtGroup().start === range.start;
          if (completed && !isLatestActiveGroup && !msg.isError)
            delete expandedThoughts[thoughtGroupKey(range.start)];
          var groupNode = range
            ? app.querySelector(':scope > .thought-group[data-thought-start="'
                + range.start + '"]') : null;
          if (groupNode) groupNode.outerHTML = renderThoughtGroup(range.start);
          else replaceMessageRow(row);
          restoreViewport(viewport, followBottom);
          updateScrollToBottomButton();
        },
        scrollToBottom: scrollToBottom
      };

      scrollToBottomButton.addEventListener('click', function () {
        if (app.scrollTo)
          app.scrollTo({ top: app.scrollHeight, behavior: 'smooth' });
        else
          scrollToBottom();
      });

      // Qt WebEngine's default HTML clipboard payload includes CF_HTML
      // offsets that Microsoft Word may render as visible text.  Export the
      // selected response as plain text so every paste target receives only
      // the model content (the same behavior as copying to a text editor).
      document.addEventListener('copy', function (event) {
        var selection = window.getSelection();
        if (!selection || selection.isCollapsed || !event.clipboardData) return;
        event.preventDefault();
        event.clipboardData.clearData();
        event.clipboardData.setData('text/plain', selection.toString());
      });

      document.addEventListener('click', function (event) {
        var artifactToggle = event.target;
        while (artifactToggle && artifactToggle !== document
               && !artifactToggle.getAttribute('data-artifact-key'))
          artifactToggle = artifactToggle.parentNode;
        if (artifactToggle && artifactToggle.getAttribute
            && artifactToggle.getAttribute('data-artifact-key')) {
          // 把所属轮次一起送出去（data-artifact-key 形如 "artifacts:<row>"），
          // 侧边栏列表据此把这一轮问答的产物排在最前并异色显示。
          var artifactKey = String(artifactToggle.getAttribute('data-artifact-key') || '');
          var artifactRow = Number(artifactKey.split(':').pop());
          // 把「本轮真正变动的文件」路径一并送出：侧边栏只对这些异色。
          var turnFiles = [];
          if (Number.isFinite(artifactRow) && artifactRow >= 0) {
            var list = turnArtifactsForDisplay(artifactRow);
            for (var ti = 0; ti < list.length; ti++)
              turnFiles.push(String((list[ti] || {}).path || ''));
          }
          console.log('MEDCLAW_CHAT:' + JSON.stringify({
            type: 'openArtifacts',
            row: Number.isFinite(artifactRow) ? artifactRow : -1,
            paths: turnFiles
          }));
          return;
        }

        var turn = event.target;
        while (turn && turn !== document && !turn.getAttribute('data-turn-row'))
          turn = turn.parentNode;
        if (turn && turn.getAttribute && turn.getAttribute('data-turn-row')) {
          jumpToTurn(Number(turn.getAttribute('data-turn-row')));
          return;
        }

        var tool = event.target;
        while (tool && tool !== document && !tool.getAttribute('data-tool-key'))
          tool = tool.parentNode;
        if (tool && tool.getAttribute && tool.getAttribute('data-tool-key')) {
          var toolKeyValue = tool.getAttribute('data-tool-key');
          userControlledTools[toolKeyValue] = true;
          expandedTools[toolKeyValue] = tool.getAttribute('aria-expanded') !== 'true';
          renderAll(false, captureViewport());
          return;
        }

        var thought = event.target;
        while (thought && thought !== document && !thought.getAttribute('data-thought-key'))
          thought = thought.parentNode;
        if (thought && thought.getAttribute && thought.getAttribute('data-thought-key')) {
          var thoughtKeyValue = thought.getAttribute('data-thought-key');
          userControlledThoughts[thoughtKeyValue] = true;
          expandedThoughts[thoughtKeyValue] = thought.getAttribute('aria-expanded') !== 'true';
          renderAll(false, captureViewport());
          return;
        }

        var node = event.target;
        while (node && node.tagName !== 'A') node = node.parentNode;
        if (!node) return;
        event.preventDefault();
        if (node.classList && node.classList.contains('artifact-card')) {
          console.log('MEDCLAW_CHAT:' + JSON.stringify({
            type: 'openArtifact',
            path: node.getAttribute('data-file-path') || ''
          }));
          return;
        }
        var href = node.getAttribute('href') || node.href;
        window.location.href = href.indexOf('medclaw-local:') === 0 ? href : node.href;
      });

      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        var thought = event.target;
        if (thought && thought.getAttribute && thought.getAttribute('data-thought-key')) {
          event.preventDefault();
          var thoughtKeyValue = thought.getAttribute('data-thought-key');
          userControlledThoughts[thoughtKeyValue] = true;
          expandedThoughts[thoughtKeyValue] = thought.getAttribute('aria-expanded') !== 'true';
          renderAll(false, captureViewport());
          return;
        }
        var tool = event.target;
        if (!tool || !tool.getAttribute || !tool.getAttribute('data-tool-key')) return;
        event.preventDefault();
        var key = tool.getAttribute('data-tool-key');
        userControlledTools[key] = true;
        expandedTools[key] = tool.getAttribute('aria-expanded') !== 'true';
        renderAll(false, captureViewport());
      });

      document.addEventListener('mouseover', function (event) {
        updateFileHover(fileNodeFromTarget(event.target));
        var turn = event.target;
        while (turn && turn !== document && !turn.getAttribute('data-turn-row'))
          turn = turn.parentNode;
        if (turn && turn.classList)
          showTurnTooltip(turn);
      });

      document.addEventListener('mouseout', function (event) {
        var file = fileNodeFromTarget(event.target);
        if (file && file === hoveredFile
            && !(event.relatedTarget && file.contains(event.relatedTarget)))
          clearFileHover();
        var turn = event.target;
        while (turn && turn !== document && !turn.getAttribute('data-turn-row'))
          turn = turn.parentNode;
        if (turn && turn.classList
            && !(event.relatedTarget && turn.contains(event.relatedTarget)))
          hideTurnTooltip();
      });

      document.addEventListener('mousemove', function (event) {
        var file = fileNodeFromTarget(event.target);
        if (file) updateFileHover(file);
        else clearFileHover();
      });

      document.addEventListener('mouseleave', clearFileHover);
      window.addEventListener('blur', clearFileHover);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) clearFileHover();
      });

      document.addEventListener('scroll', function (event) {
        clearFileHover();
        hideTurnTooltip();
        markScrolling(event.target);
        if (event.target === app) {
          updateScrollToBottomButton();
          updateActiveTurn();
        }
      }, true);

      window.addEventListener('resize', updateScrollToBottomButton);
    })();
  </script>
</body>
</html>
