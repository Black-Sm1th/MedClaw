<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: "Alibaba PuHuiTi Regular";
      src: url("qrc:///fonts/AlibabaPuHuiTi-3-55-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Alibaba PuHuiTi Medium";
      src: url("qrc:///fonts/AlibabaPuHuiTi-3-65-Medium.ttf") format("truetype");
      font-style: normal;
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Alibaba PuHuiTi Bold";
      src: url("qrc:///fonts/AlibabaPuHuiTi-3-85-Bold.ttf") format("truetype");
      font-style: normal;
      font-weight: bold;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      box-sizing: border-box;
      color: rgba(0, 0, 0, .86);
      font-family: "Alibaba PuHuiTi Regular", "Microsoft YaHei", Arial, "Noto Sans CJK SC", "Noto Color Emoji", sans-serif;
      font-size: 16px;
      line-height: 1.62;
      letter-spacing: 0;
      word-spacing: 0;
      font-variant-numeric: normal;
      text-align: left;
      text-rendering: auto;
    }

    #app {
      box-sizing: border-box;
      width: calc(100% - 8px);
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 0 16px 8px 44px;
    }

    .turn-nav {
      position: absolute;
      z-index: 20;
      left: 10px;
      top: 50%;
      display: flex;
      max-height: 60%;
      flex-direction: column;
      gap: 0;
      overflow: visible;
      transform: translateY(-50%);
    }
    .turn-nav[hidden] { display: none; }
    .turn-nav-item {
      position: relative;
      display: flex;
      width: 24px;
      height: 6px;
      padding: 0;
      align-items: center;
      border: 0;
      background: transparent;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 4px;
    }
    .turn-nav-item:last-child {
      margin-bottom: 0;
    }
    .turn-nav-item:focus,
    .turn-nav-item:focus-visible {
      outline: none;
      box-shadow: none;
    }
    .turn-nav-mark {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 111px;
      background: #EBEDF0;
      transition: width 140ms ease, background-color 140ms ease;
    }
    .turn-nav-item:hover .turn-nav-mark {
      width: 6px;
      background: #C9CDD5;
    }
    .turn-nav-item.active .turn-nav-mark {
      width: 12px;
      background: #E6E7EB;
    }
    .turn-nav-tooltip {
      position: fixed;
      z-index: 1000;
      display: block;
      width: max-content;
      max-width: 280px;
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.65) !important;
      color: #FFFFFF !important;
      font-size: 14px !important;
      line-height: 19px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 120ms ease, transform 120ms ease;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .18);
    }
    .turn-nav-tooltip.visible {
      opacity: 1;
      visibility: visible;
    }

    #app::-webkit-scrollbar,
    pre::-webkit-scrollbar,
    .table-wrap::-webkit-scrollbar,
    .tool-detail-text::-webkit-scrollbar,
    .orphan-tool::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    #app::-webkit-scrollbar-track,
    pre::-webkit-scrollbar-track,
    .table-wrap::-webkit-scrollbar-track,
    .tool-detail-text::-webkit-scrollbar-track,
    .orphan-tool::-webkit-scrollbar-track {
      background: transparent;
    }

    #app::-webkit-scrollbar-thumb,
    pre::-webkit-scrollbar-thumb,
    .table-wrap::-webkit-scrollbar-thumb,
    .tool-detail-text::-webkit-scrollbar-thumb,
    .orphan-tool::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: transparent;
    }

    #app:hover::-webkit-scrollbar-thumb,
    #app.scrolling::-webkit-scrollbar-thumb,
    pre:hover::-webkit-scrollbar-thumb,
    pre.scrolling::-webkit-scrollbar-thumb,
    .table-wrap:hover::-webkit-scrollbar-thumb,
    .table-wrap.scrolling::-webkit-scrollbar-thumb,
    .tool-detail-text:hover::-webkit-scrollbar-thumb,
    .tool-detail-text.scrolling::-webkit-scrollbar-thumb,
    .orphan-tool:hover::-webkit-scrollbar-thumb,
    .orphan-tool.scrolling::-webkit-scrollbar-thumb {
      background: rgba(15, 23, 42, .24);
    }

    #app:hover::-webkit-scrollbar-thumb:hover,
    #app.scrolling::-webkit-scrollbar-thumb:hover,
    pre:hover::-webkit-scrollbar-thumb:hover,
    .table-wrap:hover::-webkit-scrollbar-thumb:hover,
    .tool-detail-text:hover::-webkit-scrollbar-thumb:hover,
    .orphan-tool:hover::-webkit-scrollbar-thumb:hover {
      background: rgba(15, 23, 42, .38);
    }

    .message {
      box-sizing: border-box;
      width: 100%;
      max-width: 840px;
      margin: 0 auto 12px;
    }

    .message.user {
      display: flex;
      justify-content: flex-end;
    }

    .bubble {
      box-sizing: border-box;
      min-height: 24px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .bubble.user {
      width: fit-content;
      max-width: 75%;
      min-width: 48px;
      padding: 12px 16px;
      background: #EBEDF0;
      color: rgba(0, 0, 0, .9);
    }

    .user-file-ref,
    .user-file-ref:hover {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 260px;
      margin: 1px 3px;
      padding: 3px 8px;
      border: 1px solid rgba(84, 73, 180, .18);
      border-radius: 6px;
      background: rgba(116, 103, 214, .14);
      color: rgba(0, 0, 0, .82);
      text-decoration: none;
      vertical-align: middle;
      white-space: nowrap;
    }

    .user-file-icon {
      position: relative;
      width: 12px;
      height: 14px;
      flex: 0 0 12px;
      border: 1px solid rgba(84, 73, 180, .55);
      border-radius: 2px;
      box-sizing: border-box;
    }

    .user-file-icon:before,
    .user-file-icon:after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      height: 1px;
      background: rgba(84, 73, 180, .55);
    }

    .user-file-icon:before { top: 4px; }
    .user-file-icon:after { top: 8px; }

    .user-file-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bubble.assistant {
      width: 100%;
      padding: 12px 16px;
      color: rgba(0, 0, 0, .85);
      background: transparent;
    }

    .bubble.intermediate {
      color: rgba(0, 0, 0, .55);
      font-style: italic;
    }

    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body > :last-child { margin-bottom: 0; }
    p { margin: 0 0 10px; }
    h1, h2, h3, h4, h5, h6 {
      margin: 18px 0 8px;
      line-height: 1.32;
      font-weight: 700;
      color: rgba(0, 0, 0, .9);
    }
    h1 { font-size: 1.42em; }
    h2 { font-size: 1.28em; }
    h3 { font-size: 1.16em; }
    h4, h5, h6 { font-size: 1.04em; }
    ul, ol { margin: 0 0 10px 1.35em; padding: 0; }
    li { margin: 3px 0; }
    blockquote {
      margin: 10px 0;
      padding: 8px 12px;
      border-left: 3px solid #94a3b8;
      background: #f8fafc;
      color: rgba(0, 0, 0, .58);
    }
    pre {
      margin: 10px 0;
      padding: 12px;
      overflow-x: auto;
      border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 8px;
      background: #f6f8fa;
      line-height: 1.48;
      white-space: pre;
    }
    code {
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      font-size: .92em;
    }
    :not(pre) > code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #f6f8fa;
    }
    .num-run {
      display: inline-block;
      white-space: nowrap;
      font-family: Arial, "Helvetica Neue", "Noto Sans", sans-serif;
      letter-spacing: 0;
      word-spacing: 0;
      font-kerning: normal;
      font-variant-numeric: normal;
      font-feature-settings: "kern" 1;
      text-align: left;
    }
    .table-wrap {
      width: 100%;
      margin: 10px 0;
      display: block;
      overflow-x: auto;
    }
    table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }
    th, td {
      padding: 7px 9px;
      border: 1px solid rgba(15, 23, 42, .12);
      text-align: left;
      vertical-align: top;
      word-break: normal;
      overflow-wrap: break-word;
    }
    th,
    .nowrap-cell {
      white-space: nowrap;
      overflow-wrap: normal;
    }
    th:last-child, td:last-child {
      min-width: 18em;
      white-space: normal;
    }
    th { background: #f1f5f9; font-weight: 650; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a.local-file-link,
    a.local-file-link:hover {
      text-decoration: none;
    }
    a.local-file-link code {
      color: inherit;
      background: #f6f8fa;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    a.local-file-link:hover code {
      background:
        linear-gradient(currentColor, currentColor) left calc(100% - 2px) / 100% 1px repeat-x,
        #f6f8fa;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    a.local-file-link .num-run {
      display: inline;
      color: inherit;
    }
    hr { height: 1px; border: 0; margin: 16px 0; background: rgba(15, 23, 42, .12); }

    .artifact-section {
      box-sizing: border-box;
      width: 100%;
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid #E6E7EB;
      font-family: "Alibaba PuHuiTi Regular", "Microsoft YaHei", sans-serif;
      font-weight: 400;
      letter-spacing: 0;
    }
    .artifact-header {
      display: flex;
      min-height: 32px;
      margin-bottom: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .artifact-heading {
      min-width: 0;
      font-family: "Alibaba PuHuiTi Bold", "Microsoft YaHei", sans-serif;
      font-size: 20px;
      font-weight: bold;
      line-height: 28px;
      white-space: nowrap;
    }
    .artifact-title { color: #000000; }
    .artifact-count {
      margin-left: 4px;
      color: rgba(0, 0, 0, 0.45);
    }
    .artifact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .artifact-card,
    .artifact-card:hover {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 0;
      height: 36px;
      padding: 6px 8px;
      border-radius: 8px;
      background: #F7F9FA;
      color: #000000;
      text-decoration: none;
    }
    .artifact-card:hover { background: #EBEDF0; }
    .artifact-icon {
      display: block;
      flex: 0 0 20px;
      width: 20px;
      height: 20px;
      margin-right: 4px;
      object-fit: contain;
    }
    .artifact-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      line-height: 24px;
      color: #000000;
    }
    .artifact-more {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      height: 32px;
      margin: 0;
      padding: 4px 0 4px 12px;
      border: 0;
      background: transparent;
      color: #006BFF;
      font-family: inherit;
      font-weight: 400;
      font-size: 16px;
      line-height: 24px;
      letter-spacing: 0;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .artifact-more:focus,
    .artifact-more:focus-visible {
      outline: none;
      box-shadow: none;
    }
    .artifact-more:hover {
      background: transparent;
      color: #006BFF;
      text-decoration: none;
    }
    .artifact-more-arrow {
      position: relative;
      display: inline-block;
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      margin-left: 4px;
    }
    .artifact-more-arrow:before {
      content: "";
      position: absolute;
      left: 5px;
      top: 5px;
      width: 5px;
      height: 5px;
      border-right: 1.2px solid currentColor;
      border-bottom: 1.2px solid currentColor;
      transform: rotate(-45deg);
    }
    @media (max-width: 720px) {
      .artifact-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 460px) {
      .artifact-grid { grid-template-columns: minmax(0, 1fr); }
    }

    .compaction {
      position: relative;
      height: 20px;
    }
    .compaction:before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      height: 1px;
      background: rgba(0, 0, 0, .08);
    }

    .tool {
      box-sizing: border-box;
      width: 100%;
      max-width: 840px;
      margin: 0 auto 12px;
      color: rgba(0, 0, 0, .86);
    }
    .tool-header {
      display: flex;
      align-items: center;
      gap: 0;
      min-height: 24px;
      user-select: none;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tool-header:focus,
    .tool-header:focus-visible {
      outline: none;
      box-shadow: none;
    }
    .tool-name {
      font-family: "Alibaba PuHuiTi Bold", "Microsoft YaHei", Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      color: #000000;
    }
    .tool-arrow {
      margin-left: 2px;
      color: rgba(0, 0, 0, .55);
      font-size: 13px;
      line-height: 1;
    }
    .status-slot {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .status-icon {
      display: block;
      width: 16px;
      height: 16px;
      object-fit: contain;
    }
    .spinner {
      box-sizing: border-box;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid rgba(0, 107, 255, .22);
      border-top-color: #006BFF;
      animation: spin .75s linear infinite;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.error { background: #EF4444; animation: none; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .tool-detail-text,
    .orphan-tool {
      font-family: "Alibaba PuHuiTi Regular", "Microsoft YaHei", Arial, sans-serif;
      box-sizing: border-box;
      color: #000000;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
      font-size: 16px;
      font-weight: 400;
    }
    .tool-detail-text {
      max-height: 160px;
      margin: 0 0 0 24px;
      overflow: auto;
      line-height: 22px;
    }
    .tool-detail-text.error,
    .orphan-tool.error {
      color: #FF3D40;
    }
    .orphan-tool-title {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 6px;
      color: #000000;
      font-family: "Alibaba PuHuiTi Bold", "Microsoft YaHei", Arial, sans-serif;
      font-weight: bold;
      font-size: 16px;
    }
    .task-complete {
      display: flex;
      align-items: center;
      gap: 0;
      min-height: 24px;
      margin-top: 8px;
      color: #000000;
      font-family: "Alibaba PuHuiTi Bold", "Microsoft YaHei", Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <nav id="turn-nav" class="turn-nav" aria-label="对话快速跳转" hidden></nav>
  <div id="turn-nav-tooltip" class="turn-nav-tooltip" role="tooltip" aria-hidden="true"></div>
  <script>
    (function () {
      var app = document.getElementById('app');
      var messages = [];
      var expandedTools = {};
      var renderToken = 0;
      var hoveredFile = null;
      var conversationRunning = false;
      var turnNav = document.getElementById('turn-nav');
      var turnNavTooltip = document.getElementById('turn-nav-tooltip');
      var activeTurnRow = -1;
      var turnNavSignature = '';

      function fileNodeFromTarget(target) {
        return target && target.closest
          ? target.closest('.user-file-ref, .artifact-card') : null;
      }

      function clearFileHover() {
        if (!hoveredFile) return;
        hoveredFile = null;
        console.log('MEDCLAW_CHAT:' + JSON.stringify({ type: 'fileHoverEnd' }));
      }

      function updateFileHover(file) {
        if (!file || file === hoveredFile) return;
        hoveredFile = file;
        var rect = file.getBoundingClientRect();
        console.log('MEDCLAW_CHAT:' + JSON.stringify({
          type: 'fileHover',
          path: file.getAttribute('data-file-path') || '',
          x: rect.left,
          y: rect.top,
          width: rect.width,
          height: rect.height
        }));
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#96;');
      }

      function normalizeNumericSpacing(value) {
        var text = String(value || '').replace(/[\u00a0\u2007\u202f]/g, ' ');
        for (var i = 0; i < 3; i++) {
          text = text
            .replace(/(\d)\s+(?=\d)/g, '$1')
            .replace(/([\u4e00-\u9fff])\s+(?=\d)/g, '$1')
            .replace(/(\d)\s+([\u4e00-\u9fff])/g, '$1$2')
            .replace(/(\d)\s+(?=[\d.,，．%％+＋])/g, '$1')
            .replace(/([.,，．])\s+(?=\d)/g, '$1')
            .replace(/(\d)\s+([%％+＋])/g, '$1$2')
            .replace(/([+＋])\s+([\u4e00-\u9fff])/g, '$1$2')
            .replace(/(\d)\s*([-–~～])\s*(?=\d)/g, '$1$2')
            .replace(/([第约近超逾])\s+(?=\d)/g, '$1');
        }
        return text;
      }

      function protectNumericRuns(html) {
        return String(html || '').replace(/(<[^>]+>|&[a-zA-Z#0-9]+;|[^<&]+)/g, function (part) {
          if (part.charAt(0) === '<' || part.charAt(0) === '&') return part;
          return part.replace(/[+-]?\d[\d.,，．:：/\\-–~～%％+＋]*/g, function (run) {
            return '<span class="num-run">' + run + '</span>';
          });
        });
      }

      function localLinkHref(ref) {
        return 'medclaw-local:' + encodeURIComponent(ref);
      }

      function decodeHtmlText(value) {
        return String(value || '')
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&amp;/g, '&');
      }

      function isLikelyLocalRef(ref) {
        var value = String(ref || '').trim();
        return /^(?:file:\/\/|~\/|\/)/.test(value)
          || /^(?:[A-Za-z]:[\\/]|\\\\[^<>:"/\\|?*\r\n]+[\\/][^<>:"/\\|?*\r\n]+[\\/])(?:[^<>:"/\\|?*\r\n]+[\\/])*[^<>:"/\\|?*\r\n]+\.(?:json|md|markdown|txt|csv|tsv|html?|pdf|docx?|xlsx?|pptx?|png|jpe?g|gif|webp|svg|py|js|ts|tsx|jsx|cpp|c|h|hpp|qml|pro|cmake|yml|yaml|xml|log)$/i.test(value)
          || /^(?:\.{1,2}\/)?[A-Za-z0-9_.-]+(?:\/[A-Za-z0-9_.-]+)+\.(?:json|md|markdown|txt|csv|tsv|html?|pdf|docx?|xlsx?|pptx?|png|jpe?g|gif|webp|svg|py|js|ts|tsx|jsx|cpp|c|h|hpp|qml|pro|cmake|yml|yaml|xml|log)$/.test(value)
          || /^[A-Za-z0-9_.-]+\.(?:json|md|markdown|txt|csv|tsv|html?|pdf|docx?|xlsx?|pptx?|png|jpe?g|gif|webp|svg|py|js|ts|tsx|jsx|cpp|c|h|hpp|qml|pro|cmake|yml|yaml|xml|log)$/.test(value);
      }

      function inlineCodeHtml(code) {
        var ref = decodeHtmlText(code).trim();
        if (!isLikelyLocalRef(ref))
          return '<code>' + code + '</code>';
        return '<a href="' + escapeAttr(localLinkHref(ref)) + '" class="local-file-link"><code>'
          + code + '</code></a>';
      }

      function inlineMarkdown(text) {
        var out = escapeHtml(normalizeNumericSpacing(text));
        out = out.replace(/`([^`]+)`/g, function (_, code) { return inlineCodeHtml(code); });
        out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        out = out.replace(/(^|[^\w/])__([^_\s][^_]*?[^_\s])__(?=$|[^\w/])/g, '$1<strong>$2</strong>');
        out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        out = out.replace(/(^|[^\w/])_([^_\s][^_]*?[^_\s])_(?=$|[^\w/])/g, '$1<em>$2</em>');
        out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, label, href) {
          return '<a href="' + escapeAttr(href) + '">' + label + '</a>';
        });
        return protectNumericRuns(out);
      }

      function flushParagraph(buffer, html) {
        if (!buffer.length) return;
        html.push('<p>' + inlineMarkdown(buffer.join(' ')) + '</p>');
        buffer.length = 0;
      }

      function splitTableRow(line) {
        var s = line.trim();
        if (s.charAt(0) === '|') s = s.slice(1);
        if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
        return s.split('|').map(function (cell) { return cell.trim(); });
      }

      function isTableSeparator(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
      }

      function tableCellClass(cell, index) {
        var compact = normalizeNumericSpacing(cell)
          .replace(/[`*_~\[\]()]/g, '')
          .replace(/\s+/g, '');
        return index === 0 || compact.length <= 18 ? ' class="nowrap-cell"' : '';
      }

      function renderList(lines, start, html, ordered) {
        var tag = ordered ? 'ol' : 'ul';
        var pattern = ordered ? /^\s*\d+\.\s+(.+)$/ : /^\s*[-*+]\s+(.+)$/;
        var i = start;
        html.push('<' + tag + '>');
        while (i < lines.length) {
          var match = lines[i].match(pattern);
          if (!match) break;
          html.push('<li>' + inlineMarkdown(match[1]) + '</li>');
          i++;
        }
        html.push('</' + tag + '>');
        return i;
      }

      function renderTable(lines, start, html) {
        var headers = splitTableRow(lines[start]);
        var i = start + 2;
        html.push('<div class="table-wrap"><table><thead><tr>');
        headers.forEach(function (cell) { html.push('<th>' + inlineMarkdown(cell) + '</th>'); });
        html.push('</tr></thead><tbody>');
        while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim() !== '') {
          html.push('<tr>');
          splitTableRow(lines[i]).forEach(function (cell, index) {
            html.push('<td' + tableCellClass(cell, index) + '>' + inlineMarkdown(cell) + '</td>');
          });
          html.push('</tr>');
          i++;
        }
        html.push('</tbody></table></div>');
        return i;
      }

      function renderMarkdown(markdown) {
        var lines = String(markdown || '').replace(/\r\n/g, '\n').split('\n');
        var html = [];
        var paragraph = [];
        var i = 0;

        while (i < lines.length) {
          var line = lines[i];

          if (/^\s*```/.test(line)) {
            flushParagraph(paragraph, html);
            var code = [];
            i++;
            while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
            if (i < lines.length) i++;
            html.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>');
            continue;
          }

          if (/^\s*$/.test(line)) {
            flushParagraph(paragraph, html);
            i++;
            continue;
          }

          if (/^\s*#{1,6}\s+/.test(line)) {
            flushParagraph(paragraph, html);
            var h = line.match(/^\s*(#{1,6})\s+(.+)$/);
            html.push('<h' + h[1].length + '>' + inlineMarkdown(h[2]) + '</h' + h[1].length + '>');
            i++;
            continue;
          }

          if (/^\s*>/.test(line)) {
            flushParagraph(paragraph, html);
            var quote = [];
            while (i < lines.length && /^\s*>/.test(lines[i])) quote.push(lines[i++].replace(/^\s*>\s?/, ''));
            html.push('<blockquote>' + renderMarkdown(quote.join('\n')) + '</blockquote>');
            continue;
          }

          if (/^\s*[-*+]\s+/.test(line)) {
            flushParagraph(paragraph, html);
            i = renderList(lines, i, html, false);
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            flushParagraph(paragraph, html);
            i = renderList(lines, i, html, true);
            continue;
          }

          if (i + 1 < lines.length && line.indexOf('|') !== -1 && isTableSeparator(lines[i + 1])) {
            flushParagraph(paragraph, html);
            i = renderTable(lines, i, html);
            continue;
          }

          if (/^\s*---+\s*$/.test(line)) {
            flushParagraph(paragraph, html);
            html.push('<hr>');
            i++;
            continue;
          }

          paragraph.push(line.trim());
          i++;
        }

        flushParagraph(paragraph, html);
        return html.join('');
      }

      function plainTextHtml(text) {
        return protectNumericRuns(escapeHtml(normalizeNumericSpacing(text)));
      }

      function streamingTextHtml(text) {
        return '<span data-stream-text="true">' + escapeHtml(text) + '</span>';
      }

      function fileNameFromPath(path) {
        var normalized = String(path || '').replace(/[\\/]+$/, '');
        var parts = normalized.split(/[\\/]/);
        return parts[parts.length - 1] || normalized;
      }

      function renderUserContent(text) {
        var value = String(text || '');
        var pattern = /"((?:[A-Za-z]:[\\/]|\\\\|\/)[^"\r\n]+)"/g;
        var html = [];
        var cursor = 0;
        var match;
        while ((match = pattern.exec(value)) !== null) {
          html.push(plainTextHtml(value.slice(cursor, match.index)));
          var path = match[1];
          html.push('<a class="user-file-ref" href="'
            + escapeAttr(localLinkHref(path)) + '" data-file-path="' + escapeAttr(path) + '">'
            + '<span class="user-file-icon"></span>'
            + '<span class="user-file-name">' + escapeHtml(fileNameFromPath(path)) + '</span>'
            + '</a>');
          cursor = match.index + match[0].length;
        }
        html.push(plainTextHtml(value.slice(cursor)));
        return html.join('');
      }

      function artifactIconPath(file) {
        if (file && (file.isDirectory === true || file.type === 'directory'
                     || file.type === 'folder'))
          return 'qrc:/images/doc/document-fold.svg';
        var ext = String((file && file.extension) || '').toLowerCase();
        if (ext === 'doc' || ext === 'docx')
          return 'qrc:/images/doc/document-word.svg';
        if (ext === 'xls' || ext === 'xlsx' || ext === 'xlsm' || ext === 'csv')
          return 'qrc:/images/doc/document-excel.svg';
        if (ext === 'ppt' || ext === 'pptx')
          return 'qrc:/images/doc/document-ppt.svg';
        return 'qrc:/images/doc/document-text.svg';
      }

      function renderArtifacts(artifacts, row) {
        if (!Array.isArray(artifacts) || artifacts.length === 0)
          return '';
        var key = 'artifacts:' + row;
        var visible = artifacts;
        var html = ['<div class="artifact-section">'];
        html.push('<div class="artifact-header">'
          + '<div class="artifact-heading"><span class="artifact-title">产物</span>'
          + '<span class="artifact-count">(' + artifacts.length + ')</span></div>'
          + '<button class="artifact-more" type="button" data-artifact-key="'
          + escapeAttr(key) + '">查看全部'
          + '<span class="artifact-more-arrow" aria-hidden="true"></span></button>'
          + '</div>');
        html.push('<div class="artifact-grid">');
        for (var i = 0; i < visible.length; i++) {
          var file = visible[i] || {};
          var path = String(file.path || '');
          var iconPath = artifactIconPath(file);
          html.push('<a class="artifact-card" href="' + escapeAttr(localLinkHref(path))
            + '" data-file-path="' + escapeAttr(path) + '">'
            + '<img class="artifact-icon" src="' + escapeAttr(iconPath) + '" alt="">'
            + '<span class="artifact-name">' + escapeHtml(file.name || fileNameFromPath(path)) + '</span>'
            + '</a>');
        }
        html.push('</div>');
        html.push('</div>');
        return html.join('');
      }

      function isCompactionMarker(msg) {
        var c = String(msg.content || '').trim().toLowerCase();
        return msg.msgType !== 'toolCall'
          && msg.msgType !== 'toolResult'
          && msg.msgRole !== 'user'
          && c === 'compaction';
      }

      function toolVisuallyComplete(items, index, isRunning) {
        var msg = items[index] || {};
        if (!msg.hasToolResult) return false;
        if (msg.isError || !isRunning) return true;

        var lastUser = -1;
        for (var i = items.length - 1; i >= 0; i--) {
          if ((items[i] || {}).msgRole === 'user') {
            lastUser = i;
            break;
          }
        }
        if (index < lastUser) return true;

        for (var j = index + 1; j < items.length; j++) {
          if ((items[j] || {}).msgType === 'toolCall') return true;
        }
        return false;
      }

      function statusIcon(msg, completed) {
        if (!completed) return '<span class="spinner"></span>';
        if (msg.isError) return '<span class="dot error"></span>';
        return '<img class="status-icon" src="qrc:///images/toolSuccess.png" alt="">';
      }

      function renderToolCall(msg, index) {
        var completed = toolVisuallyComplete(messages, index, conversationRunning);
        var detail = completed ? msg.toolResultText : msg.toolArgs;
        var key = toolKey(msg, index);
        var expanded = !completed || expandedTools[key] === true;
        var html = [];
        html.push('<div class="tool" data-row="' + index + '">');
        html.push('<div class="tool-header" data-tool-key="' + escapeAttr(key)
          + '" role="button" tabindex="0" aria-expanded="' + (expanded ? 'true' : 'false') + '">');
        html.push('<span class="status-slot">' + statusIcon(msg, completed) + '</span>');
        html.push('<span class="tool-name">' + escapeHtml(msg.toolName || '工具') + '</span>');
        html.push('<span class="tool-arrow" aria-hidden="true">' + (expanded ? '▾' : '▸') + '</span>');
        html.push('</div>');
        if (expanded && String(detail || '').length > 0)
          html.push('<div class="tool-detail-text' + (msg.isError ? ' error' : '')
            + (completed ? '" data-tool-result-row="' + index : '') + '">'
            + plainTextHtml(detail || '') + '</div>');
        html.push('</div>');
        return html.join('');
      }

      function renderOrphanToolResult(msg, index) {
        return '<div class="message" data-row="' + index + '">'
          + '<div class="orphan-tool' + (msg.isError ? ' error' : '') + '">'
          + '<div class="orphan-tool-title"><span class="status-slot">' + statusIcon({ isError: msg.isError }, true) + '</span>'
          + '<span>' + escapeHtml(msg.toolName || '工具结果') + '</span></div>'
          + plainTextHtml(msg.content || '')
          + '</div></div>';
      }

      function renderTextMessage(msg, index) {
        var isUser = msg.msgRole === 'user';
        var classes = 'bubble ' + (isUser ? 'user' : 'assistant markdown-body');
        if (msg.isIntermediate) classes += ' intermediate';
        var body = '';
        if (isUser)
          body = renderUserContent(msg.content || '');
        else if (msg.isStreaming)
          body = streamingTextHtml(msg.content || '');
        else
          body = renderMarkdown(msg.content || '');
        return '<div class="message ' + (isUser ? 'user' : 'assistant') + '" data-row="' + index + '">'
          + '<div class="' + classes + '" data-content-row="' + index + '">' + body + '</div>'
          + (!isUser && shouldRenderTaskComplete(index)
              ? '<div class="task-complete"><span class="status-slot"><img class="status-icon" src="qrc:///images/missonSuccess.png" alt=""></span><span>任务完成</span></div>'
              : '')
          + (!isUser ? renderArtifacts(msg.artifacts, index) : '')
          + '</div>';
      }

      function shouldRenderTaskComplete(index) {
        if (conversationRunning || !messages[index]
            || messages[index].msgRole !== 'assistant'
            || messages[index].msgType !== 'text'
            || messages[index].isIntermediate)
          return false;
        var lastUser = -1;
        var lastFinalAssistant = -1;
        var allToolsFinished = true;
        for (var i = 0; i < messages.length; i++) {
          var item = messages[i] || {};
          if (item.msgRole === 'user') {
            lastUser = i;
            lastFinalAssistant = -1;
            allToolsFinished = true;
          } else if (i > lastUser && item.msgType === 'toolCall') {
            if (!item.hasToolResult) allToolsFinished = false;
          } else if (i > lastUser && item.msgRole === 'assistant'
                     && item.msgType === 'text' && !item.isIntermediate
                     && String(item.content || '').trim().length > 0) {
            lastFinalAssistant = i;
          }
        }
        return lastUser >= 0 && allToolsFinished && index === lastFinalAssistant;
      }

      function renderMessage(msg, index) {
        msg = msg || {};
        if (isCompactionMarker(msg))
          return '<div class="message compaction" data-row="' + index + '"></div>';
        if (msg.msgType === 'toolCall')
          return renderToolCall(msg, index);
        if (msg.msgType === 'toolResult')
          return renderOrphanToolResult(msg, index);
        return renderTextMessage(msg, index);
      }

      function scrollToBottom() {
        app.scrollTop = app.scrollHeight;
        updateActiveTurn();
      }

      function toolKey(msg, index) {
        return (msg.toolCallId && String(msg.toolCallId).length > 0)
          ? 'id:' + msg.toolCallId
          : 'idx:' + index;
      }

      function turnLabel(msg) {
        var text = String((msg && msg.content) || '')
          .replace(/\s+/g, ' ').trim();
        if (!text) return '对话';
        return text.length > 34 ? text.slice(0, 34) + '…' : text;
      }

      function rebuildTurnNav() {
        hideTurnTooltip();
        var html = [];
        var signature = [];
        for (var i = 0; i < messages.length; i++) {
          var msg = messages[i] || {};
          if (msg.msgRole !== 'user' || msg.msgType === 'toolCall'
              || msg.msgType === 'toolResult')
            continue;
          var label = turnLabel(msg);
          signature.push(i + ':' + label);
          html.push('<button class="turn-nav-item" type="button" data-turn-row="'
            + i + '" data-turn-label="' + escapeAttr(label)
            + '" aria-label="跳转到：' + escapeAttr(label) + '">');
          html.push('<span class="turn-nav-mark" aria-hidden="true"></span>');
          html.push('</button>');
        }
        signature = signature.join('|');
        if (signature === turnNavSignature) {
          updateActiveTurn();
          return;
        }
        turnNavSignature = signature;
        turnNav.innerHTML = html.join('');
        turnNav.hidden = html.length === 0;
        activeTurnRow = -1;
        updateActiveTurn();
      }

      function updateActiveTurn() {
        if (!turnNav || turnNav.hidden) return;
        var rows = turnNav.querySelectorAll('[data-turn-row]');
        if (!rows.length) return;
        var appTop = app.getBoundingClientRect().top;
        var threshold = appTop + Math.min(120, app.clientHeight * .28);
        var selected = Number(rows[0].getAttribute('data-turn-row'));
        for (var i = 0; i < rows.length; i++) {
          var row = Number(rows[i].getAttribute('data-turn-row'));
          var messageNode = app.querySelector(':scope > [data-row="' + row + '"]');
          if (messageNode && messageNode.getBoundingClientRect().top <= threshold)
            selected = row;
          else if (messageNode)
            break;
        }
        if (isNearBottom())
          selected = Number(rows[rows.length - 1].getAttribute('data-turn-row'));
        if (activeTurnRow === selected) return;
        activeTurnRow = selected;
        for (var j = 0; j < rows.length; j++)
          rows[j].classList.toggle('active', Number(rows[j].getAttribute('data-turn-row')) === selected);
      }

      function jumpToTurn(row) {
        var node = app.querySelector(':scope > [data-row="' + row + '"]');
        if (!node) return;
        var targetTop = app.scrollTop + node.getBoundingClientRect().top
          - app.getBoundingClientRect().top - 12;
        if (app.scrollTo)
          app.scrollTo({ top: targetTop, behavior: 'smooth' });
        else
          app.scrollTop = targetTop;
        activeTurnRow = -1;
        updateActiveTurn();
      }

      function showTurnTooltip(turn) {
        if (!turnNavTooltip || !turn) return;
        var label = turn.getAttribute('data-turn-label') || '';
        if (!label) return;
        var rect = turn.getBoundingClientRect();
        turnNavTooltip.textContent = label;
        turnNavTooltip.style.left = Math.round(rect.right + 8) + 'px';
        turnNavTooltip.style.top = Math.round(rect.top + rect.height / 2) + 'px';
        turnNavTooltip.classList.add('visible');
        turnNavTooltip.setAttribute('aria-hidden', 'false');
      }

      function hideTurnTooltip() {
        if (!turnNavTooltip) return;
        turnNavTooltip.classList.remove('visible');
        turnNavTooltip.setAttribute('aria-hidden', 'true');
      }

      function isNearBottom() {
        return app.scrollHeight - app.clientHeight - app.scrollTop <= 80;
      }

      function captureViewport() {
        var appTop = app.getBoundingClientRect().top;
        var nodes = app.querySelectorAll(':scope > [data-row]');
        for (var i = 0; i < nodes.length; i++) {
          var rect = nodes[i].getBoundingClientRect();
          if (rect.bottom > appTop) {
            return {
              row: nodes[i].getAttribute('data-row'),
              offset: rect.top - appTop,
              scrollTop: app.scrollTop
            };
          }
        }
        return { row: null, offset: 0, scrollTop: app.scrollTop };
      }

      function restoreViewport(viewport, followBottom) {
        if (followBottom) {
          scrollToBottom();
          return;
        }
        if (viewport && viewport.row !== null) {
          var anchor = app.querySelector(':scope > [data-row="' + viewport.row + '"]');
          if (anchor) {
            var appTop = app.getBoundingClientRect().top;
            app.scrollTop += anchor.getBoundingClientRect().top - appTop - viewport.offset;
            return;
          }
        }
        app.scrollTop = viewport ? viewport.scrollTop : app.scrollTop;
      }

      function messageEquals(a, b) {
        if (!a || !b) return a === b;
        return a.msgRole === b.msgRole
          && a.msgType === b.msgType
          && a.content === b.content
          && a.toolName === b.toolName
          && a.toolArgs === b.toolArgs
          && a.toolCallId === b.toolCallId
          && a.isError === b.isError
          && a.toolResultText === b.toolResultText
          && a.hasToolResult === b.hasToolResult
          && a.isStreaming === b.isStreaming
          && a.isIntermediate === b.isIntermediate
          && JSON.stringify(a.artifacts || []) === JSON.stringify(b.artifacts || []);
      }

      function replaceMessageRow(row) {
        var node = app.querySelector(':scope > [data-row="' + row + '"]');
        if (!node) return false;
        if (hoveredFile && node.contains(hoveredFile))
          clearFileHover();
        node.outerHTML = renderMessage(messages[row], row);
        return true;
      }

      function scrollToolResultToBottom(row) {
        var node = app.querySelector('[data-tool-result-row="' + row + '"]');
        if (!node) return;
        node.scrollTop = node.scrollHeight;
        requestAnimationFrame(function () {
          if (node.isConnected)
            node.scrollTop = node.scrollHeight;
        });
      }

      function revealToolResult(row, text, followBottom) {
        var node = app.querySelector('[data-tool-result-row="' + row + '"]');
        if (!node) return;
        var value = String(text || '');
        var parts = value.match(/[^\n]*\n|[^\n]+$/g) || [];
        if (parts.length === 1 && value.length > 120) {
          parts = [];
          for (var offset = 0; offset < value.length; offset += 120)
            parts.push(value.slice(offset, offset + 120));
        }
        if (parts.length <= 1) return;

        var batchSize = Math.max(1, Math.ceil(parts.length / 30));
        var shown = '';
        var cursor = 0;
        node.innerHTML = '';
        function appendBatch() {
          if (!node.isConnected) return;
          for (var count = 0; count < batchSize && cursor < parts.length; count++)
            shown += parts[cursor++];
          node.innerHTML = plainTextHtml(shown);
          node.scrollTop = node.scrollHeight;
          if (followBottom) scrollToBottom();
          if (cursor < parts.length)
            setTimeout(appendBatch, 45);
        }
        appendBatch();
      }

      function patchMessages(nextMessages, followBottom) {
        if (nextMessages.length < messages.length)
          return false;

        var changed = [];
        var sharedCount = Math.min(messages.length, nextMessages.length);
        for (var i = 0; i < sharedCount; i++) {
          var dataChanged = !messageEquals(messages[i], nextMessages[i]);
          var visualStateChanged = (messages[i] || {}).msgType === 'toolCall'
            && toolVisuallyComplete(messages, i, conversationRunning)
              !== toolVisuallyComplete(nextMessages, i, conversationRunning);
          if (dataChanged || visualStateChanged)
            changed.push(i);
        }

        // A large change is normally a history/session reload. Full rendering is
        // cheaper and less error-prone than replacing many detached DOM rows.
        if (changed.length > 8 || nextMessages.length - messages.length > 8)
          return false;

        var previousMessages = messages;
        messages = nextMessages;
        for (var j = 0; j < changed.length; j++) {
          var changedRow = changed[j];
          var before = previousMessages[changedRow] || {};
          var after = messages[changedRow] || {};
          var beforeCompleted = before.msgType === 'toolCall'
            && toolVisuallyComplete(previousMessages, changedRow, conversationRunning);
          var afterCompleted = after.msgType === 'toolCall'
            && toolVisuallyComplete(messages, changedRow, conversationRunning);
          if (!beforeCompleted && afterCompleted)
            delete expandedTools[toolKey(after, changedRow)];
          if (!replaceMessageRow(changedRow))
            return false;
          if (after.msgType === 'toolCall'
              && !afterCompleted
              && String(after.toolResultText || '').length > 0)
            scrollToolResultToBottom(changedRow);
          if (after.msgType === 'toolCall'
              && !beforeCompleted && afterCompleted
              && String(before.toolResultText || '').length === 0
              && String(after.toolResultText || '').length > 0)
            revealToolResult(changedRow, after.toolResultText, followBottom);
          else if (after.msgType === 'toolCall'
                   && String(after.toolResultText || '').length > 0)
            scrollToolResultToBottom(changedRow);
        }
        for (var row = sharedCount; row < messages.length; row++)
          app.insertAdjacentHTML('beforeend', renderMessage(messages[row], row));
        return true;
      }

      function markScrolling(node) {
        if (!node || !node.classList) return;
        node.classList.add('scrolling');
        if (node._scrollHideTimer)
          clearTimeout(node._scrollHideTimer);
        node._scrollHideTimer = setTimeout(function () {
          node.classList.remove('scrolling');
          node._scrollHideTimer = null;
        }, 850);
      }

      function renderAll(shouldScrollToBottom, viewport) {
        clearFileHover();
        var token = ++renderToken;
        var index = 0;
        var htmlParts = [];

        function renderBatch() {
          if (token !== renderToken)
            return;

          var html = [];
          var chars = 0;
          var count = 0;
          while (index < messages.length && count < 24 && chars < 120000) {
            var piece = renderMessage(messages[index], index);
            html.push(piece);
            chars += piece.length;
            index++;
            count++;
          }

          if (html.length)
            htmlParts.push(html.join(''));

          if (index < messages.length) {
            setTimeout(renderBatch, 0);
            return;
          }

          // Build large histories off-screen first. The prior implementation
          // inserted every batch into #app, changing scrollHeight repeatedly
          // before the final scroll-to-bottom and making the thumb jump.
          app.innerHTML = htmlParts.join('');
          rebuildTurnNav();
          requestAnimationFrame(function () {
            if (token === renderToken) {
              restoreViewport(viewport, shouldScrollToBottom);
              updateActiveTurn();
            }
          });
        }

        renderBatch();
      }

      window.MedClawChat = {
        setMessages: function (items, forceFullRender, isConversationRunning) {
          var nextMessages = Array.isArray(items) ? items : [];
          var nextRunning = isConversationRunning === true;
          var runningChanged = conversationRunning !== nextRunning;
          conversationRunning = nextRunning;
          if (forceFullRender || (runningChanged && !nextRunning))
            expandedTools = {};
          var followBottom = messages.length === 0 || isNearBottom();
          var viewport = followBottom ? null : captureViewport();
          if (forceFullRender || runningChanged
              || !patchMessages(nextMessages, followBottom)) {
            messages = nextMessages;
            renderAll(followBottom, viewport);
            return;
          }
          rebuildTurnNav();
          restoreViewport(viewport, followBottom);
        },
        appendStreamDelta: function (row, delta) {
          row = Number(row);
          if (!messages[row]) return;
          var followBottom = isNearBottom();
          var viewport = followBottom ? null : captureViewport();
          messages[row].content = String(messages[row].content || '') + String(delta || '');
          messages[row].isStreaming = true;
          var node = app.querySelector('[data-content-row="' + row + '"]');
          if (!node) {
            renderAll(followBottom, viewport);
            return;
          }
          var streamNode = node.querySelector('[data-stream-text]');
          if (!streamNode) {
            node.innerHTML = streamingTextHtml(messages[row].content || '');
          } else if (streamNode.firstChild && streamNode.firstChild.nodeType === 3) {
            streamNode.firstChild.appendData(String(delta || ''));
          } else {
            streamNode.appendChild(document.createTextNode(String(delta || '')));
          }
          restoreViewport(viewport, followBottom);
        },
        appendToolDelta: function (row, delta) {
          row = Number(row);
          if (!messages[row] || messages[row].msgType !== 'toolCall') return;
          var value = String(delta || '');
          if (!value) return;
          var followBottom = isNearBottom();
          var viewport = followBottom ? null : captureViewport();
          messages[row].toolResultText = String(messages[row].toolResultText || '') + value;
          var node = app.querySelector('[data-tool-result-row="' + row + '"]');
          if (!node) {
            var card = app.querySelector(':scope > [data-row="' + row + '"]');
            if (card) card.outerHTML = renderMessage(messages[row], row);
            node = app.querySelector('[data-tool-result-row="' + row + '"]');
            if (node) scrollToolResultToBottom(row);
            restoreViewport(viewport, followBottom);
            return;
          }
          if (node.lastChild && node.lastChild.nodeType === 3)
            node.lastChild.appendData(value);
          else
            node.appendChild(document.createTextNode(value));
          node.scrollTop = node.scrollHeight;
          requestAnimationFrame(function () {
            if (!node.isConnected) return;
            node.scrollTop = node.scrollHeight;
            restoreViewport(viewport, followBottom);
          });
          restoreViewport(viewport, followBottom);
        },
        scrollToBottom: scrollToBottom
      };

      // Qt WebEngine's default HTML clipboard payload includes CF_HTML
      // offsets that Microsoft Word may render as visible text.  Export the
      // selected response as plain text so every paste target receives only
      // the model content (the same behavior as copying to a text editor).
      document.addEventListener('copy', function (event) {
        var selection = window.getSelection();
        if (!selection || selection.isCollapsed || !event.clipboardData) return;
        event.preventDefault();
        event.clipboardData.clearData();
        event.clipboardData.setData('text/plain', selection.toString());
      });

      document.addEventListener('click', function (event) {
        var artifactToggle = event.target;
        while (artifactToggle && artifactToggle !== document
               && !artifactToggle.getAttribute('data-artifact-key'))
          artifactToggle = artifactToggle.parentNode;
        if (artifactToggle && artifactToggle.getAttribute
            && artifactToggle.getAttribute('data-artifact-key')) {
          console.log('MEDCLAW_CHAT:' + JSON.stringify({ type: 'openArtifacts' }));
          return;
        }

        var turn = event.target;
        while (turn && turn !== document && !turn.getAttribute('data-turn-row'))
          turn = turn.parentNode;
        if (turn && turn.getAttribute && turn.getAttribute('data-turn-row')) {
          jumpToTurn(Number(turn.getAttribute('data-turn-row')));
          return;
        }

        var tool = event.target;
        while (tool && tool !== document && !tool.getAttribute('data-tool-key'))
          tool = tool.parentNode;
        if (tool && tool.getAttribute && tool.getAttribute('data-tool-key')) {
          var toolKeyValue = tool.getAttribute('data-tool-key');
          if (expandedTools[toolKeyValue] === true)
            delete expandedTools[toolKeyValue];
          else
            expandedTools[toolKeyValue] = true;
          renderAll(false, captureViewport());
          return;
        }

        var node = event.target;
        while (node && node.tagName !== 'A') node = node.parentNode;
        if (!node) return;
        event.preventDefault();
        if (node.classList && node.classList.contains('artifact-card')) {
          console.log('MEDCLAW_CHAT:' + JSON.stringify({
            type: 'openArtifact',
            path: node.getAttribute('data-file-path') || ''
          }));
          return;
        }
        var href = node.getAttribute('href') || node.href;
        window.location.href = href.indexOf('medclaw-local:') === 0 ? href : node.href;
      });

      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        var tool = event.target;
        if (!tool || !tool.getAttribute || !tool.getAttribute('data-tool-key')) return;
        event.preventDefault();
        var key = tool.getAttribute('data-tool-key');
        if (expandedTools[key] === true)
          delete expandedTools[key];
        else
          expandedTools[key] = true;
        renderAll(false, captureViewport());
      });

      document.addEventListener('mouseover', function (event) {
        updateFileHover(fileNodeFromTarget(event.target));
        var turn = event.target;
        while (turn && turn !== document && !turn.getAttribute('data-turn-row'))
          turn = turn.parentNode;
        if (turn && turn.classList)
          showTurnTooltip(turn);
      });

      document.addEventListener('mouseout', function (event) {
        var file = fileNodeFromTarget(event.target);
        if (file && file === hoveredFile
            && !(event.relatedTarget && file.contains(event.relatedTarget)))
          clearFileHover();
        var turn = event.target;
        while (turn && turn !== document && !turn.getAttribute('data-turn-row'))
          turn = turn.parentNode;
        if (turn && turn.classList
            && !(event.relatedTarget && turn.contains(event.relatedTarget)))
          hideTurnTooltip();
      });

      document.addEventListener('mousemove', function (event) {
        var file = fileNodeFromTarget(event.target);
        if (file) updateFileHover(file);
        else clearFileHover();
      });

      document.addEventListener('mouseleave', clearFileHover);
      window.addEventListener('blur', clearFileHover);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) clearFileHover();
      });

      document.addEventListener('scroll', function (event) {
        clearFileHover();
        hideTurnTooltip();
        markScrolling(event.target);
        if (event.target === app) updateActiveTurn();
      }, true);
    })();
  </script>
</body>
</html>
