map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream onlyoffice_backend {
    server onlyoffice-documentserver:80;
}

upstream bridge_backend {
    server office-bridge:8000;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    client_max_body_size 200m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    location = /bridge {
        return 301 /bridge/;
    }

    location /bridge/ {
        proxy_pass http://bridge_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /bridge;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://onlyoffice_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
